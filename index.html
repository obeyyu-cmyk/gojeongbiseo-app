<title>고정비서</title>

<style>@font-face{font-family:"GJ Pretendard";font-weight:500;font-style:normal;font-display:swap;src:url(fonts/pretendard-500.woff2) format("woff2")}
@font-face{font-family:"GJ Pretendard";font-weight:600;font-style:normal;font-display:swap;src:url(fonts/pretendard-600.woff2) format("woff2")}
@font-face{font-family:"GJ Pretendard";font-weight:700;font-style:normal;font-display:swap;src:url(fonts/pretendard-700.woff2) format("woff2")}
/* 고정비서 시험판 — 'AI 티' 걷어내기 규칙(껄계부 2026-10-24에서 가져옴)
   · 회색 바탕 위 흰 카드: 모서리 20 · 안쪽 20 · 카드 사이 12, 테두리·그림자 없음, 줄 사이 선 대신 간격
   · 글자 크기 7단계만: 32 큰 숫자 · 26 화면 제목 · 20 창 제목 · 18 카드 제목 · 17 줄 · 16 본문 · 14 작은 회색 / 굵기 500·600·700만
   · 읽기 쉬움(2026-10-26, 사용자 "글이 잘 안 읽혀"): 회색·빨강·주황 글은 대비 4.5 이상, 작은 글 14px부터, 여러 줄 글은 줄간격 1.6·왼쪽 정렬
   · 상징색 초록 #0EA27D는 바꾸지 않는다(사용자 "상징색을 바꿔야 하나" 2026-10-26) — 초록 위 흰 글자는 굵게 17px 이상으로
   · 색은 누를 곳·경고에만. 설명 문장 대신 꺾쇠·스위치·칩. 3D 그림에 그림자 없음
   · 디자인 A안(흰 카드)·글꼴 Pretendard로 정함 (2026-10-25) */
:root {
  --bg: #F3F4F8; --card: #FFFFFF; --ink: #191F28; --sub: #4E5968; --faint: #5F6B78; --line: #E5E8EB; --fill: #F2F4F6;
  --green: #0EA27D; --green-t: #0B7A5C; --mint: #E8F7F1; --orange: #E8590C; --orange-t: #C2410C; --orange-bg: #FFF0E6; --red: #E5484D; --red-t: #C4262E; --red-bg: #FDECEC;
  --t-big: 32px; --t-title: 26px; --t-sheet: 20px; --t-card: 18px; --t-row: 17px; --t-body: 16px; --t-small: 14px;
  --r: 20px;
  --f-body: "GJ Pretendard", -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", system-ui, sans-serif;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: var(--t-row); font-weight: 500; line-height: 1.5; letter-spacing: 0; word-break: keep-all; overflow-wrap: anywhere; }
body { min-height: 100vh; overscroll-behavior-y: contain; }
button { font: inherit; color: inherit; border: 0; background: none; padding: 0; cursor: pointer; }
input, select { font: inherit; color: inherit; }
b, strong { font-weight: 700; }
a { color: var(--green-t); }
.num { font-variant-numeric: tabular-nums; }
#app { max-width: 480px; margin: 0 auto; min-height: 100vh; position: relative; }
.screen { padding: 12px 20px 120px; animation: in .2s ease-out; }
.screen.no-tab { padding-bottom: 40px; }
@keyframes in { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
.ico { width: 24px; height: 24px; stroke: currentColor; stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; flex: none; }

/* 위쪽 줄 */
.appbar { display: flex; align-items: center; gap: 12px; padding: 4px 0 16px; }
.logo { width: 40px; height: 40px; border-radius: 12px; background: var(--green); display: grid; place-items: center; flex: none; }
.logo svg { width: 26px; height: 26px; }
.brand b { display: block; font-size: var(--t-sheet); font-weight: 700; letter-spacing: -.02em; }
.brand span { display: block; font-size: var(--t-small); color: var(--sub); }
.appbar .sp { flex: 1; }
.iconbtn { width: 44px; height: 44px; border-radius: 12px; display: grid; place-items: center; color: #4E5968; margin-right: -10px; }
.iconbtn:active { background: var(--fill); }
.topbar { display: flex; align-items: center; gap: 4px; padding: 2px 0 12px; }
.topbar h1 { font-size: var(--t-sheet); margin: 0; font-weight: 700; }
.back { width: 44px; height: 44px; display: grid; place-items: center; margin-left: -12px; border-radius: 12px; }
.back:active { background: var(--fill); }

/* 홈 */
.hello { font-size: var(--t-body); font-weight: 600; color: var(--sub); margin-top: 2px; }
.total { font-size: var(--t-big); letter-spacing: -.02em; margin: 2px 0 16px; line-height: 1.2; }
.est { display: inline-block; font-size: var(--t-small); font-weight: 600; color: var(--faint); margin-left: 6px; letter-spacing: 0; }
.hero { position: relative; border-radius: var(--r); padding: 20px; min-height: 172px; overflow: hidden; background: var(--card); color: var(--ink); }
.hero h2 { margin: 0; font-size: var(--t-title); line-height: 1.3; letter-spacing: -.02em; max-width: 64%; }
.hero h2 em { color: var(--green-t); font-style: normal; }
.hero p { margin: 6px 0 16px; font-size: var(--t-body); font-weight: 600; max-width: 60%; color: var(--sub); }
.hero img { position: absolute; right: 4px; bottom: -10px; width: 40%; max-width: 160px; pointer-events: none; }
.hero .hero-btn { display: inline-flex; align-items: center; gap: 2px; min-height: 44px; padding: 0; font-size: var(--t-row); font-weight: 700; color: var(--green-t); }
.hero .hero-btn .ico { width: 18px; height: 18px; }
.hero .hero-btn:active { opacity: .6; }
.saved { display: flex; align-items: center; gap: 8px; color: var(--green-t); padding: 14px 4px 0; font-weight: 600; font-size: var(--t-body); }
.saved .ico { width: 20px; height: 20px; }
.grid4 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin: 12px 0; }
.cat { background: var(--card); border-radius: var(--r); padding: 16px; display: flex; flex-direction: column; gap: 2px; text-align: left; min-height: 104px; }
.cat:active { background: #FAFBFC; }
.cat .ico { width: 24px; height: 24px; color: #4E5968; margin-bottom: 8px; }
.cat .t { font-size: var(--t-small); color: var(--sub); }
.cat .v { font-size: var(--t-card); font-weight: 700; letter-spacing: -.01em; }
.cat .none { font-size: var(--t-body); font-weight: 600; color: var(--faint); }
.badge { display: inline-block; align-self: flex-start; font-size: var(--t-small); font-weight: 700; margin-top: 6px; letter-spacing: 0; }   /* 바탕 없는 글자 꼬리표(알약 상자 X) */
.badge.o { color: var(--orange-t); }
.badge.g { color: var(--green-t); }
.badge.gray { color: var(--sub); font-weight: 600; }
.badge.r { color: var(--red-t); }
.rowcard { display: flex; align-items: center; gap: 14px; background: var(--card); border-radius: var(--r); padding: 18px 20px; width: 100%; text-align: left; }
.rowcard:active { background: #FAFBFC; }
.rowcard .ico { color: #4E5968; }
.rowcard b { display: block; font-size: var(--t-row); font-weight: 600; }
.rowcard span { display: block; font-size: var(--t-small); color: var(--sub); }
.rowcard .chev { margin-left: auto; color: var(--faint); width: 20px; height: 20px; }

/* 아래 탭: 고른 탭은 알약 없이 진한 글자 · 채운 아이콘 */
.tabbar { position: fixed; left: 50%; transform: translateX(-50%); bottom: 0; width: 100%; max-width: 480px; display: grid; grid-template-columns: repeat(4, 1fr); background: rgba(255, 255, 255, .97); border-top: 1px solid #F2F4F6; padding: 6px 6px calc(6px + env(safe-area-inset-bottom)); z-index: 20; }
.tab { display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 13px; font-weight: 600; color: var(--faint); padding: 6px 0; position: relative; min-height: 52px; }
.tab .ico { width: 24px; height: 24px; }
.tab.on { color: var(--ink); }
.tab.on .ico { fill: currentColor; }
.tab .dot { position: absolute; top: 2px; left: calc(50% + 8px); min-width: 18px; height: 18px; border-radius: 9px; background: var(--orange-t); color: #fff; font-size: 12px; font-weight: 700; display: grid; place-items: center; padding: 0 4px; }

/* 공통 카드·버튼 */
.card { background: var(--card); border-radius: var(--r); padding: 20px; margin-bottom: 12px; }
.card.plain { background: var(--fill); }
.title { font-size: var(--t-title); letter-spacing: -.02em; margin: 6px 0 2px; line-height: 1.25; }
.lead { color: var(--sub); font-size: var(--t-body); line-height: 1.6; margin: 4px 0 16px; }
.h3 { font-size: var(--t-body); font-weight: 600; margin: 20px 4px 8px; color: var(--sub); }
.btn { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; border-radius: 14px; padding: 14px 16px; min-height: 52px; font-size: var(--t-row); font-weight: 700; }
.btn:active { transform: scale(.985); }
.btn .ico { width: 20px; height: 20px; }
.btn.p { background: var(--green); color: #fff; }
.btn.p:disabled { background: #C9CED6; }
.btn.s { background: var(--card); color: var(--green-t); box-shadow: inset 0 0 0 1.5px var(--green); }
.btn.g { background: var(--fill); color: #333D4B; }
.btn.danger { background: var(--red); color: #fff; }
.btn.sm { width: auto; padding: 10px 16px; min-height: 44px; font-size: var(--t-body); border-radius: 12px; display: inline-flex; }
.pill { display: inline-flex; align-items: center; justify-content: center; background: var(--green); color: #fff; border-radius: 12px; padding: 10px 14px; min-height: 44px; font-size: var(--t-body); font-weight: 700; white-space: nowrap; }
.pill:active { transform: scale(.96); }
.pill.line { background: var(--card); color: var(--green-t); box-shadow: inset 0 0 0 1.5px var(--green); }
.pill.gray { background: var(--fill); color: #333D4B; }
.link { color: var(--sub); font-size: var(--t-body); text-decoration: underline; text-underline-offset: 3px; padding: 12px; display: block; margin: 2px auto 0; text-align: center; min-height: 44px; }
.more { display: inline-flex; align-items: center; gap: 2px; color: var(--sub); font-size: var(--t-small); font-weight: 600; min-height: 44px; }
.more.inline { text-decoration: underline; text-underline-offset: 3px; vertical-align: middle; }
.pills { display: flex; gap: 6px; flex-wrap: wrap; }
[hidden] { display: none !important; }
/* 구독 고르기: 찾기 칸 + 분야별 묶음 */
.subq { margin: 4px 0 0; }
.screen .subq { background: var(--card); box-shadow: inset 0 0 0 1px var(--line); }   /* 회색 바탕 화면에서도 칸이 보이게 */
.subh { margin: 16px 4px 2px; }
.nohit { margin-top: 12px; }
.nohit .btn { margin-top: 8px; }
/* 세 칸 고르기(인터넷 속도) */
.seg3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; background: var(--fill); border-radius: 12px; padding: 4px; margin: 0 0 12px; }
.seg3 button { min-height: 40px; border-radius: 9px; font-size: var(--t-body); font-weight: 600; color: var(--sub); }
.seg3 button.on { background: var(--card); color: var(--ink); }
/* 더 싼 요금제 카드 */
.plan .top { display: flex; justify-content: space-between; align-items: center; }
.plan .top b { font-size: var(--t-card); }
.plan .pname { font-weight: 600; margin-top: 8px; }
.plan .save { color: var(--green-t); font-weight: 600; font-size: var(--t-body); margin: 6px 0 12px; }
.plan .pickline { margin: -6px 0 12px; font-size: var(--t-small); color: var(--sub); line-height: 1.6; }
.rowcard.src { background: var(--fill); margin-bottom: 8px; }
.more .ico { width: 16px; height: 16px; }
.note { font-size: var(--t-small); color: var(--sub); line-height: 1.6; }
.note.left, .lead.left { text-align: left !important; }   /* 가운데 정렬 글이 두 줄 넘으면 왼쪽으로(읽기 쉽게) */
.strip { color: var(--green-t); font-size: var(--t-small); font-weight: 600; margin-top: 12px; display: flex; gap: 6px; align-items: flex-start; }
.strip .ico { width: 18px; height: 18px; margin-top: 1px; }
.strip.warn { color: var(--orange-t); }
.box { border-radius: 14px; padding: 12px 14px; font-size: var(--t-body); font-weight: 600; display: flex; gap: 8px; align-items: flex-start; margin: 4px 0 12px; }
.box .ico { width: 20px; height: 20px; margin-top: 1px; }
.box.ok { background: none; padding: 0 2px; color: var(--green-t); }
.box.warn { background: var(--orange-bg); color: var(--orange-t); }
.box.bad { background: var(--red-bg); color: var(--red-t); }
.gap { height: 12px; }
.center { text-align: center; }
.muted { color: var(--sub); }
.err { color: var(--red-t); font-size: var(--t-small); font-weight: 600; margin-top: 6px; display: flex; gap: 6px; align-items: flex-start; }
.err .ico, .okmsg .ico { width: 16px; height: 16px; margin-top: 2px; }
.okmsg { color: var(--green-t); font-size: var(--t-small); font-weight: 600; margin-top: 6px; display: flex; gap: 6px; align-items: flex-start; }
.field.bad { box-shadow: inset 0 0 0 1.5px var(--red); }
details.tech { margin-top: 8px; font-size: var(--t-small); color: var(--faint); }
details.tech summary { cursor: pointer; padding: 12px 0; }
details.tech pre { white-space: pre-wrap; word-break: break-all; background: var(--fill); border-radius: 10px; padding: 10px; margin: 4px 0 0; font-size: 12px; color: var(--sub); }

/* 새는 돈 */
.leak { background: var(--card); border-radius: var(--r); padding: 20px; margin-bottom: 12px; display: grid; grid-template-columns: 32px 1fr; gap: 2px 12px; }
.leak > .ico { width: 26px; height: 26px; color: #4E5968; margin-top: 1px; }
.leak h4 { margin: 0; font-size: var(--t-card); font-weight: 700; letter-spacing: -.01em; }
.leak .d { color: var(--sub); font-size: var(--t-small); margin-top: 2px; }
.leak .bot { grid-column: 2; display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-top: 12px; flex-wrap: wrap; }
.leak .amt { font-size: var(--t-card); color: var(--green-t); letter-spacing: -.01em; }
.leak.done { opacity: .6; }
/* 할 일 순서(컨설팅) 카드: 번호 · 걸리는 시간 · 주의할 점 · 다른 길 */
.leak .sno { width: 22px; color: var(--faint); font-size: var(--t-row); font-weight: 700; line-height: 1.4; }
.leak .meta { display: flex; align-items: center; gap: 4px; color: var(--faint); font-size: var(--t-small); margin-top: 6px; }
.leak .meta .ico { width: 15px; height: 15px; }
.leak .warns { list-style: none; margin: 8px 0 0; padding: 0; }
.leak .warns li { position: relative; padding-left: 14px; color: var(--orange-t); font-size: var(--t-small); margin-top: 4px; }
.leak .warns li::before { content: "!"; position: absolute; left: 2px; top: 0; font-weight: 700; }
.leak .alt { margin-top: 8px; color: var(--sub); font-size: var(--t-small); }
.leak .alt.sell { color: var(--green-t); }
.leak .alt.sell b { display: block; font-weight: 600; }   /* 가장 싼 게 온라인 전용일 때: 고정비서로 신청할 수 있는 요금제와 차이 */
.leak .amt0 { color: var(--sub); font-size: var(--t-small); }
.h3 .h3sub { display: block; font-weight: 500; font-size: var(--t-small); color: var(--faint); margin-top: 2px; }
.rowcard.report { margin: 4px 0 4px; }
.rowcard.report > .ico { color: #4E5968; }
.empty { text-align: center; padding: 24px 10px; }
.empty img { width: 120px; }
.empty b { display: block; font-size: var(--t-card); margin: 8px 0 4px; }

/* 처음 3번 고르기 */
.prog { display: flex; align-items: center; gap: 12px; padding: 4px 0 18px; }
.prog .bar { flex: 1; height: 6px; background: #E5E8EB; border-radius: 9px; overflow: hidden; }
.prog .bar i { display: block; height: 100%; background: var(--green); border-radius: 9px; transition: width .3s; }
.prog span { font-size: var(--t-small); color: var(--sub); font-weight: 600; }
.q { font-size: var(--t-title); letter-spacing: -.02em; line-height: 1.3; margin: 4px 0 6px; }
.choices { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 16px 0 4px; }
.choices.col { grid-template-columns: 1fr; }
.choices.col .choice { text-align: left; padding: 18px 20px; }
.cname { font-weight: 700; color: var(--ink); }
.choice { position: relative; background: var(--card); border-radius: 16px; padding: 20px 10px; font-size: var(--t-card); font-weight: 700; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
.chip { background: var(--card); border-radius: 12px; padding: 10px 14px; min-height: 44px; font-size: var(--t-body); font-weight: 600; box-shadow: inset 0 0 0 1px var(--line); }
.chip small { color: var(--faint); font-weight: 500; margin-left: 4px; font-size: var(--t-small); }
/* 고른 것은 검은 칩 */
.chip.on, .choice.on { background: var(--ink); color: #fff; box-shadow: none; }
.chip.on small { color: inherit; opacity: .8; }
.bottombar { position: sticky; bottom: 0; padding: 14px 0 calc(14px + env(safe-area-inset-bottom)); background: linear-gradient(to top, var(--bg) 70%, rgba(243, 244, 248, 0)); margin-top: 16px; }

/* 처음 화면·결과 */
.welcome { min-height: calc(100vh - 40px); display: flex; flex-direction: column; justify-content: center; text-align: center; padding: 30px 24px; }
.welcome img { width: 56%; max-width: 230px; margin: 0 auto 10px; animation: bob 3.4s ease-in-out infinite; }
@keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
.welcome h1 { font-size: var(--t-big); letter-spacing: -.02em; margin: 8px 0 6px; }
.welcome p { color: var(--sub); font-size: var(--t-row); margin: 0 0 28px; }
.result { text-align: center; }
.result img { width: 40%; max-width: 170px; }
.big { font-size: var(--t-big); letter-spacing: -.02em; line-height: 1.2; }
.big.g { color: var(--green-t); }

/* 표 같은 줄: 선 없이 간격으로 */
.kv { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 9px 0; font-size: var(--t-body); }
.kv .k { color: var(--sub); }
.kv .v { font-weight: 600; text-align: right; }

/* 3년 총액 비교 */
.offer { background: var(--card); border-radius: var(--r); padding: 20px; margin-bottom: 12px; }
.offer.best { box-shadow: inset 0 0 0 2px var(--green); }
.offer.cur { background: var(--fill); }
.offer .lab { font-size: var(--t-body); font-weight: 600; }
.offer .tot { font-size: var(--t-big); letter-spacing: -.02em; margin: 2px 0; }
.offer.cur .tot { color: #4E5968; }
.offer .br { color: var(--sub); font-size: var(--t-small); line-height: 1.6; }
.tag { display: inline-block; font-size: var(--t-small); color: var(--sub); background: var(--fill); border-radius: 8px; padding: 2px 8px; margin: 8px 0 12px; font-weight: 600; }
.besttag { display: inline-block; color: var(--green-t); font-size: var(--t-small); font-weight: 700; margin-bottom: 6px; }

/* 구독 넘기기 */
.stack { position: relative; height: 360px; margin: 8px 0 6px; }
.scard { position: absolute; inset: 0 6% 20px; background: var(--card); border-radius: 24px; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 24px; touch-action: pan-y; user-select: none; transition: transform .25s, opacity .25s; box-shadow: 0 1px 0 rgba(0, 0, 0, .02); }
.scard.back1 { transform: translateY(12px) scale(.95); background: #E9EDF1; }
.scard.back2 { transform: translateY(22px) scale(.9); background: #E1E6EB; }
.slogo { width: 80px; height: 80px; border-radius: 22px; display: grid; place-items: center; color: #fff; font-size: 32px; font-weight: 700; margin-bottom: 16px; }
.scard h3 { margin: 0; font-size: var(--t-sheet); font-weight: 700; }
.scard .p { font-size: var(--t-big); margin: 4px 0; letter-spacing: -.02em; }
.scard .m { color: var(--sub); font-size: var(--t-body); }
.scard .stamp { position: absolute; top: 20px; font-size: var(--t-sheet); font-weight: 700; padding: 4px 12px; border-radius: 10px; border: 2.5px solid; opacity: 0; transform: rotate(-12deg); }
.scard .stamp.k { left: 20px; color: var(--green); border-color: var(--green); }
.scard .stamp.c { right: 20px; color: var(--orange); border-color: var(--orange); transform: rotate(12deg); }
.swbtns { display: flex; justify-content: center; gap: 56px; margin-top: 8px; }
.swbtn { display: flex; flex-direction: column; align-items: center; gap: 6px; font-weight: 700; font-size: var(--t-row); }
.swbtn i { width: 76px; height: 76px; border-radius: 50%; display: grid; place-items: center; }
.swbtn i .ico { width: 34px; height: 34px; stroke-width: 2.6; }
.swbtn.c i { background: var(--orange-bg); color: var(--orange-t); }
.swbtn.k i { background: var(--mint); color: var(--green-t); }
.swbtn:active i { transform: scale(.94); }

/* 캡처 */
.capimg { display: block; max-width: 100%; max-height: 44vh; margin: 0 auto; border-radius: 14px; border: 1px solid var(--line); }
.upload { display: flex; flex-direction: column; align-items: center; gap: 6px; text-align: center; background: var(--card); border: 1.5px dashed #BFE6D7; border-radius: var(--r); padding: 24px 16px; position: relative; }
.upload b { font-size: var(--t-card); }
.upload input { position: absolute; inset: 0; opacity: 0; width: 100%; cursor: pointer; }
.upload .ico { width: 32px; height: 32px; color: var(--green); }
.samples { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.sample { background: var(--card); border-radius: 16px; padding: 10px; text-align: center; font-size: var(--t-small); font-weight: 600; }
.sample img { width: 100%; height: 140px; object-fit: cover; object-position: top; border-radius: 10px; margin-bottom: 6px; }
.reading { position: fixed; inset: 0; background: rgba(243, 244, 248, .98); z-index: 50; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 30px; }
.reading img { width: 44%; max-width: 190px; animation: bob 1.8s ease-in-out infinite; }
.reading b { font-size: var(--t-sheet); margin-top: 10px; }
.reading .dots::after { content: ""; animation: dots 1.2s steps(4) infinite; }
@keyframes dots { 0% { content: ""; } 25% { content: "."; } 50% { content: ".."; } 75% { content: "..."; } }
.crop { display: block; max-width: 100%; max-height: 60px; margin: 10px 0 0; border-radius: 8px; border: 1px solid var(--line); }
.crop.big { max-height: none; margin: 0 0 8px; }
.capstrip { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 6px; margin-bottom: 12px; }
.capstrip .capimg { max-height: 46vh; flex: none; margin: 0; }
.capline { padding: 16px; }
.capline .top { display: flex; gap: 12px; align-items: center; }
.capline .lab { flex: 1; min-width: 0; }
.capline .lab b { font-size: var(--t-row); font-weight: 600; }
.capline .amt { font-size: var(--t-card); white-space: nowrap; }
.capline .st { display: flex; gap: 4px; align-items: center; margin-top: 8px; font-size: var(--t-small); font-weight: 600; color: var(--sub); }
.capline .st .ico { width: 16px; height: 16px; }
.capline .st.ok { color: var(--green-t); }
.capline .st.warn { color: var(--orange-t); }
.capline .btnrow .btn { min-height: 44px; padding: 10px; }
.chkwrap { width: 44px; height: 44px; display: grid; place-items: center; margin: -10px -8px -10px -10px; flex: none; cursor: pointer; }
.capchk { width: 22px; height: 22px; margin: 0; accent-color: var(--green); }
.errbox > div { flex: 1; min-width: 0; }
.errbox .fix { font-weight: 500; margin-top: 2px; }
.errbox .btn { margin-top: 10px; }
.card.kvs { padding: 8px 20px; }
.strip.gray { color: var(--sub); }

/* 아래에서 올라오는 창 */
.backdrop { position: fixed; inset: 0; background: rgba(15, 20, 25, .45); z-index: 60; animation: fade .2s; }
@keyframes fade { from { opacity: 0; } }
.sheet { position: fixed; left: 50%; bottom: 0; transform: translateX(-50%); width: 100%; max-width: 480px; max-height: 88vh; overflow-y: auto; background: var(--card); border-radius: 24px 24px 0 0; z-index: 61; padding: 10px 20px calc(20px + env(safe-area-inset-bottom)); animation: up .26s cubic-bezier(.2, .9, .3, 1); }
@keyframes up { from { transform: translate(-50%, 100%); } }
.sheet .grab { width: 36px; height: 4px; border-radius: 9px; background: #D1D6DB; margin: 2px auto 14px; }
.sheet h3 { font-size: var(--t-sheet); margin: 0 0 4px; font-weight: 700; letter-spacing: -.02em; }
.sheet .lead { margin-bottom: 12px; }
.steps { counter-reset: s; margin: 10px 0 16px; padding: 0; list-style: none; }
.steps li { counter-increment: s; position: relative; padding: 0 0 12px 34px; font-size: var(--t-body); }
.steps li::before { content: counter(s); position: absolute; left: 0; top: 0; width: 24px; height: 24px; border-radius: 50%; background: var(--fill); color: #4E5968; font-weight: 700; font-size: var(--t-small); display: grid; place-items: center; }
.btnrow { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 8px; }
.stepper { display: flex; align-items: center; gap: 8px; margin: 6px 0 2px; }
.stepper button { width: 48px; height: 48px; border-radius: 12px; background: var(--fill); font-size: 22px; font-weight: 700; }
.stepper input { flex: 1; min-width: 0; text-align: center; font-size: var(--t-sheet); font-weight: 700; border: 0; background: var(--fill); border-radius: 12px; padding: 10px; }
.field { width: 100%; border: 0; background: var(--fill); border-radius: 12px; padding: 14px; font-size: var(--t-row); margin-top: 6px; }
.lbl { font-size: var(--t-small); font-weight: 600; color: var(--sub); margin: 16px 0 2px; display: block; }
.confirmbar { background: var(--orange-bg); color: var(--orange-t); border-radius: 14px; padding: 12px 14px; margin-bottom: 12px; font-weight: 600; font-size: var(--t-body); }
.confirmbar .btnrow { margin-top: 10px; }
.toast { position: fixed; left: 50%; bottom: 92px; transform: translateX(-50%); background: rgba(25, 31, 40, .95); color: #fff; padding: 12px 18px; border-radius: 14px; font-size: var(--t-body); font-weight: 600; z-index: 80; max-width: calc(100% - 40px); text-align: center; animation: toast .25s ease-out; }
@keyframes toast { from { opacity: 0; transform: translate(-50%, 10px); } }
.undo { position: fixed; left: 50%; bottom: 84px; transform: translateX(-50%); width: calc(100% - 32px); max-width: 448px; background: rgba(25, 31, 40, .96); color: #fff; padding: 6px 6px 6px 18px; border-radius: 14px; display: flex; align-items: center; gap: 10px; z-index: 81; animation: toast .25s ease-out; font-size: var(--t-body); font-weight: 600; }
.undo span { flex: 1; }
.undo button { color: #7CE3C2; font-weight: 700; padding: 10px 14px; min-height: 44px; border-radius: 10px; }
.undo i { position: absolute; left: 12px; right: 12px; bottom: 3px; height: 2px; background: rgba(255, 255, 255, .25); border-radius: 2px; transform-origin: left; animation: undoBar 6s linear forwards; }
@keyframes undoBar { to { transform: scaleX(0); } }

/* 끝나는 순간 축하 창 */
.cele { text-align: center; padding: 4px 0 4px; }
.cele img { width: 42%; max-width: 170px; animation: pop .5s cubic-bezier(.2, 1.4, .4, 1); }
@keyframes pop { from { transform: scale(.6); opacity: 0; } }
.cele .big { margin: 6px 0 2px; }

/* 설정 카드 제목 */
.ctitle { display: block; font-size: var(--t-card); font-weight: 700; }

/* 움직임 줄이기를 켠 폰에서는 움직임을 끈다 */
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; } }

/* 큰 숫자·제목은 굵기 700 */
.total, .hero h2, .title, .q, .welcome h1, .big, .cat .v, .leak .amt, .offer .tot, .scard .p, .capline .amt { font-weight: 700; }

/* 공유 */
.sharepreview { display: block; width: 70%; max-width: 290px; margin: 4px auto 16px; border-radius: 20px; }
.toggle { display: flex; align-items: center; justify-content: space-between; background: var(--card); border-radius: 16px; padding: 14px 16px; margin-bottom: 10px; font-weight: 600; min-height: 56px; }
.sw { width: 50px; height: 30px; border-radius: 99px; background: #D1D6DB; position: relative; transition: background .2s; flex: none; }
.sw::after { content: ""; position: absolute; top: 3px; left: 3px; width: 24px; height: 24px; border-radius: 50%; background: #fff; transition: left .2s; }
.sw.on { background: var(--green); }
.sw.on::after { left: 23px; }
.sharebtns { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 12px; }
.alert { display: flex; gap: 4px; align-items: center; background: var(--card); border-radius: var(--r); padding: 8px 6px 8px 16px; margin-bottom: 10px; }
.alert-main { display: flex; gap: 14px; align-items: center; flex: 1; min-width: 0; text-align: left; padding: 8px 0; min-height: 56px; }
.alert .cal { margin: 0; color: var(--sub); flex: none; }
.dday { flex: none; width: 52px; color: var(--sub); font-weight: 700; font-size: var(--t-body); text-align: left; }   /* D-날짜는 글자로(색 상자 X), 7일 안이면 빨강 */
.dday.near { color: var(--red-t); }
.alert b { display: block; font-size: var(--t-row); font-weight: 600; }
.alert span { display: block; color: var(--sub); font-size: var(--t-small); }
/* 폰 알림 켜기 카드 */
.notify { display: flex; gap: 12px; align-items: center; }
.notify > .ico { color: var(--green-t); }
.notify > div { flex: 1; min-width: 0; }
.notify b { display: block; font-size: var(--t-row); font-weight: 600; }
.notify span { display: block; font-size: var(--t-small); color: var(--sub); }
.notify.ask { flex-wrap: wrap; margin: 12px 0 0; }   /* 홈: 큰 카드와 12 띄우고, 아래 카드들과도 12 */
.notify.ask .btnrow { flex: 0 0 100%; margin-top: 4px; }   /* 버튼 줄은 늘 아래 한 줄을 다 쓴다 */
.ico.inl { width: 16px; height: 16px; vertical-align: -3px; }
.ver { color: var(--faint); font-size: var(--t-small); text-align: center; margin-top: 18px; }
/* 진단서 한 장 */
.card.report { padding: 22px 20px; }
.report .rp-h { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; flex-wrap: wrap; margin-bottom: 6px; }
.report .rp-h b { font-size: var(--t-sheet); font-weight: 700; }
.report .rp-h span { color: var(--faint); font-size: var(--t-small); }
.report .rp-k { color: var(--sub); font-size: var(--t-small); font-weight: 600; margin: 18px 0 2px; }
.report .rp-big { font-size: var(--t-title); font-weight: 700; letter-spacing: -.02em; }
.report .rp-save { font-size: var(--t-card); font-weight: 700; color: var(--green-t); }
.report .rp-steps { margin: 6px 0 0; padding-left: 22px; }
.report .rp-steps li { margin-top: 8px; }
.report .rp-steps li b { display: block; font-weight: 700; }
.report .rp-steps li span { color: var(--green-t); font-size: var(--t-small); font-weight: 600; }
.report .rp-warns { list-style: none; margin: 6px 0 0; padding: 0; }
.report .rp-warns li { position: relative; padding-left: 14px; color: var(--orange-t); font-size: var(--t-small); margin-top: 4px; }
.report .rp-warns li::before { content: "!"; position: absolute; left: 2px; font-weight: 700; }
.report .rp-next { display: flex; align-items: center; gap: 8px; margin-top: 18px; padding-top: 14px; border-top: 1px solid var(--line); font-size: var(--t-body); }
.report .rp-next .ico { width: 18px; height: 18px; color: var(--green-t); flex: none; }
/* 따라 하기 안내(공식 안내에서 확인한 것만) */
.guide { margin: 16px 0 8px; padding: 16px; background: var(--fill); border-radius: 16px; }
.guide .gt { font-weight: 700; font-size: var(--t-row); margin-bottom: 4px; }
.guide .steps { margin-bottom: 4px; }
.guide .steps li::before { background: var(--card); }
.guide .script { margin: 4px 0 8px; padding: 12px 14px; background: var(--card); border-radius: 12px; font-size: var(--t-body); }
.guide .script b { display: block; font-size: var(--t-small); color: var(--sub); margin-bottom: 4px; }
.guide .script p { margin: 6px 0 0; }
.guide .gnotes { margin: 4px 0 0; padding-left: 18px; color: var(--sub); font-size: var(--t-small); }
.guide .gnotes li { margin-top: 4px; }
.guide .btn { margin-top: 10px; }
.box.warn ul.warns { list-style: none; margin: 4px 0 0; padding: 0; font-weight: 500; font-size: var(--t-small); }
.box.warn ul.warns li { margin-top: 4px; }
.box.warn > div { flex: 1; min-width: 0; }
/* ── 인터페이스 고도화: 분야 색 · 홈 요약 막대 · 다음 할 일 · 다가오는 날 · 믿을 이유 · 떠 있는 아래 메뉴 ── */
/* 분야 색: --cc 글자·아이콘(바탕 대비 4.5 이상), --cf 막대 채움, --cb 옅은 바탕 */
.c-phone { --cc: #2457C5; --cf: #4C86F7; --cb: #EAF1FF; }
.c-net { --cc: #5B3FD1; --cf: #8C6CF5; --cb: #F0ECFF; }
.c-tv { --cc: #A84D14; --cf: #F09A4F; --cb: #FFF1E5; }
.c-subs { --cc: #B02D66; --cf: #EA6A9C; --cb: #FDEDF4; }
.home .total { margin-bottom: 10px; }
.home .sum { margin-bottom: 16px; }
.split { display: flex; gap: 2px; height: 10px; border-radius: 99px; overflow: hidden; background: var(--fill); margin: 0 0 10px; }
.split i { background: #D1D6DB; min-width: 6px; }
.split i.top { background: var(--green); }
.legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: var(--t-small); font-weight: 600; color: var(--sub); }
.legend .top { color: var(--ink); font-weight: 700; }
.hprog { margin-top: 14px; max-width: 58%; }
.hprog .bar { height: 6px; border-radius: 99px; background: var(--fill); overflow: hidden; }
.hprog .bar i { display: block; height: 100%; border-radius: 99px; background: var(--green); }
.hprog span { display: block; margin-top: 6px; font-size: var(--t-small); font-weight: 600; color: var(--sub); }
.sec { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin: 22px 4px 6px; }
.sec h3 { margin: 0; font-size: var(--t-row); font-weight: 700; }
.secmore { display: inline-flex; align-items: center; gap: 2px; min-height: 44px; padding: 0 2px; color: var(--sub); font-size: var(--t-small); font-weight: 600; }
.secmore .ico { width: 16px; height: 16px; }
.card.list { padding: 4px 0; }
.li { display: flex; align-items: center; gap: 12px; width: 100%; min-height: 60px; padding: 10px 16px; text-align: left; }
.li + .li { border-top: 1px solid var(--fill); }
.li .sno { flex: none; width: 20px; color: var(--faint); font-size: var(--t-row); font-weight: 700; }
.li-t { flex: 1; min-width: 0; }
.li-t b { display: block; font-size: var(--t-body); font-weight: 600; }
.li-t small { display: block; font-size: var(--t-small); color: var(--faint); }
.li-a { flex: none; font-size: var(--t-body); font-weight: 700; color: var(--green-t); }
.hscroll { display: flex; gap: 10px; overflow-x: auto; margin: 0 -20px; padding: 2px 20px 6px; scroll-snap-type: x mandatory; scrollbar-width: none; }
.hscroll::-webkit-scrollbar { display: none; }
.dcard { flex: 0 0 auto; width: 148px; min-height: 116px; scroll-snap-align: start; display: flex; flex-direction: column; align-items: flex-start; gap: 6px; padding: 14px; border-radius: 16px; background: var(--card); text-align: left; }
.dcard b { font-size: var(--t-body); font-weight: 700; line-height: 1.35; }
.dcard > span:last-child { font-size: var(--t-small); color: var(--faint); }
.dd { display: inline-block; color: var(--sub); font-size: var(--t-small); font-weight: 700; }
.dd.near { color: var(--red-t); }
.cat .ci { display: block; margin-bottom: 8px; color: #4E5968; }
.cat .ci .ico { width: 22px; height: 22px; margin: 0; color: inherit; }
.trustline { margin-top: 18px; }
/* 아래 메뉴는 바닥에 붙은 평범한 막대(떠 있는 둥근 메뉴·옅은 바탕 X) */
/* 새는 돈 머리: 지금 → 정리하면 */
.card.ba { padding: 16px 18px; margin: 0 0 8px; }
.ba-r { display: grid; grid-template-columns: 56px 1fr auto; align-items: center; gap: 10px; font-size: var(--t-small); font-weight: 600; color: var(--sub); }
.ba-r + .ba-r { margin-top: 10px; }
.ba-r .bar { height: 10px; border-radius: 99px; background: var(--fill); overflow: hidden; }
.ba-r .bar i { display: block; height: 100%; border-radius: 99px; background: #B0B8C1; }
.ba-r.g .bar i { background: var(--green); }
.ba-r b { font-size: var(--t-body); color: var(--ink); }
.ba-r.g b { color: var(--green-t); }
/* 3년 비교 카드: 회사 · 속도 · 가격 상자 · 차이 */
.offer .otop { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-bottom: 8px; }
.offer .co { padding: 4px 10px; border-radius: 99px; background: var(--ink); color: #fff; font-size: var(--t-small); font-weight: 700; }
.offer .spd { color: var(--sub); font-size: var(--t-small); font-weight: 600; }
.offer .besttag { margin: 0 0 0 auto; }
.offer .obox { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 12px; }
.offer .obox span { display: block; font-size: var(--t-small); font-weight: 600; color: var(--sub); }
.offer .obox b { display: block; font-size: var(--t-card); font-weight: 700; letter-spacing: -.01em; }
.offer .odiff { margin-top: 10px; font-size: var(--t-body); font-weight: 700; color: var(--green-t); }
.offer .odiff.same { font-weight: 600; color: var(--sub); }
.offer .br { margin-top: 4px; }
/* 알림: 맨 위 요약 · D-날짜 상자에 분야 색 */
.card.asum { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; padding: 16px 18px; margin: 0 0 14px; }
.asum span { display: block; font-size: var(--t-small); font-weight: 600; color: var(--sub); }
.asum b { display: block; margin-top: 2px; font-size: var(--t-body); font-weight: 700; }

/* 구독 창: 줄마다 로고 · 결제일 고르기 */
.srow { display: flex; align-items: center; gap: 10px; padding: 6px 0; }
.slogo-s { flex: none; width: 36px; height: 36px; border-radius: 10px; display: grid; place-items: center; font-size: var(--t-body); font-weight: 700; }
.srow-t { flex: 1; min-width: 0; }
.srow-t b { display: block; font-weight: 600; }
.dayb { display: inline-flex; align-items: center; gap: 4px; min-height: 40px; padding: 0 10px 0 0; border-radius: 10px; font-size: var(--t-small); font-weight: 600; color: var(--sub); }
.dayb .ico { width: 15px; height: 15px; }
.dayb.none { color: var(--orange-t); }
.dayb:active { background: var(--fill); }
.daygrid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; margin: 2px 0 10px; padding: 10px; border-radius: 14px; background: var(--fill); }
.daygrid .dg-h { grid-column: 1 / -1; padding: 0 2px 4px; font-size: var(--t-small); font-weight: 600; color: #4E5968; }
.daygrid .dg-h small { display: block; font-weight: 500; color: var(--faint); font-size: var(--t-small); }
.daygrid button { min-height: 40px; border-radius: 10px; background: var(--card); font-size: var(--t-body); font-weight: 600; }
.daygrid button.on { background: var(--ink); color: #fff; }
.daygrid .dg-x { grid-column: span 4; font-size: var(--t-small); color: var(--sub); }
.rowcard.daycta { margin: 0 0 12px; }
.rowcard.daycta > .ico:first-child { color: var(--orange-t); }
/* 고정비서로 신청(판매): 수수료 알림 · 신청 창 · 신청 내역 단계 */
.sellnote { display: flex; gap: 8px; align-items: flex-start; margin: 4px 2px 12px; font-size: var(--t-small); font-weight: 600; color: var(--sub); }
.sellnote .ico { flex: none; width: 16px; height: 16px; margin-top: 2px; color: #4E5968; }
details.guide summary { cursor: pointer; list-style: none; min-height: 40px; display: flex; align-items: center; margin: -4px 0; }
details.guide summary::-webkit-details-marker { display: none; }
details.guide summary::after { content: "펼치기"; margin-left: auto; padding-left: 8px; font-size: var(--t-small); font-weight: 600; color: var(--sub); }
details.guide[open] summary::after { content: "접기"; }
details.guide[open] summary { margin-bottom: 6px; }
.aitem { padding: 16px; margin: 0 0 12px; }
.aitem .otop { margin-bottom: 6px; }
.aitem > b { display: block; font-size: var(--t-row); font-weight: 700; }
.aitem .aprice { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 10px; margin-top: 6px; font-size: var(--t-body); color: var(--sub); font-weight: 600; }
.aitem .aprice b { color: var(--ink); font-size: var(--t-card); }
.aitem .aprice em { font-style: normal; color: var(--green-t); font-weight: 700; }
.aitem .co, .card.req .co { padding: 4px 10px; border-radius: 99px; background: var(--ink); color: #fff; font-size: var(--t-small); font-weight: 700; }
.aitem .spd, .card.req .spd { color: var(--sub); font-size: var(--t-small); font-weight: 600; }
.aitem .otop, .card.req .otop { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
.ahelp { list-style: none; margin: 0 0 6px; padding: 0; }
.ahelp li { display: flex; align-items: center; gap: 6px; margin-top: 6px; font-size: var(--t-body); font-weight: 600; }
.ahelp .ico { flex: none; width: 18px; height: 18px; color: var(--green-t); }
.agree { display: flex; align-items: flex-start; gap: 10px; margin: 16px 0 12px; font-size: var(--t-small); color: var(--sub); line-height: 1.5; }
.agree input { flex: none; width: 22px; height: 22px; margin: 0; accent-color: var(--green); }
.rsteps { list-style: none; display: flex; gap: 4px; margin: 12px 0 10px; padding: 0; }
.rsteps li { flex: 1; min-width: 0; padding-top: 10px; border-top: 4px solid var(--line); font-size: 12px; font-weight: 600; color: var(--faint); line-height: 1.3; }
.rsteps li.done { border-color: var(--green); color: var(--green-t); }
.rsteps li.now { border-color: var(--green); color: var(--ink); font-weight: 700; }
.card.req { padding: 18px; margin-bottom: 12px; }
.card.req .rdate { margin-left: auto; font-size: var(--t-small); color: var(--faint); font-weight: 600; }
.card.req .rtitle { display: block; margin-top: 8px; font-size: var(--t-row); font-weight: 700; }
.reqdone { text-align: center; }
.reqdone .rd-ico { width: 56px; height: 56px; margin: 4px auto 10px; border-radius: 50%; display: grid; place-items: center; background: var(--mint); color: var(--green-t); }
.reqdone .rd-ico .ico { width: 28px; height: 28px; }
.reqdone .card { text-align: left; margin: 12px 0; padding: 16px; }
.rowcard.reqcard { margin: 12px 0 0; }
.rowcard.reqcard > .ico:first-child { color: var(--green-t); }
/* 사은품(예시): 3년 비교 카드 · 신청서 · 홈 약정 끝 카드 (초록은 금액에만) */
.offer .gift { display: flex; gap: 10px; align-items: center; margin-top: 12px; }
.offer .gift > .ico { flex: none; width: 22px; height: 22px; color: #4E5968; }
.offer .gift b { display: block; font-size: var(--t-body); font-weight: 600; }
.offer .gift em, .rowcard.giftcard em { font-style: normal; font-weight: 700; color: var(--green-t); white-space: nowrap; }
.offer .gift span { display: block; font-size: var(--t-small); color: var(--sub); }
.card.netco b { display: block; font-size: var(--t-row); font-weight: 600; }
.card.netco > span { display: block; margin: 2px 0 10px; font-size: var(--t-small); color: var(--sub); }
.agift { display: flex; align-items: center; gap: 6px; margin-top: 8px; font-size: var(--t-small); font-weight: 600; color: var(--green-t); }
.agift .ico { flex: none; width: 16px; height: 16px; }
.rowcard.giftcard { margin: 12px 0 0; }
.rowcard.giftcard .gi { flex: none; display: block; }
.rowcard.giftcard .gi .ico { width: 24px; height: 24px; color: #4E5968; }
.rowcard.giftcard small { display: block; font-size: var(--t-small); font-weight: 600; color: var(--sub); }
.leak .d, .leak .warns li, .leak .alt, .guide .gnotes, .sellnote, .box, .strip, .agift { line-height: 1.6; }   /* 여러 줄 작은 글은 줄간격 넉넉히 */
/* 신청서를 담당자에게 보냈는지 */
.rsent { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-top: 8px; font-size: var(--t-small); font-weight: 600; color: var(--sub); }
.rsent .ico { width: 16px; height: 16px; }
.rsent.ok { color: var(--green-t); }
.rsent.fail { color: var(--orange-t); }
.rsent .more { color: var(--green-t); text-decoration: underline; text-underline-offset: 3px; min-height: 44px; padding: 0 4px; }
.seg3.seg2 { grid-template-columns: repeat(2, 1fr); }   /* 3년 비교: 인터넷만 / 인터넷+TV */
/* 회사 로고: 검은 알약 대신 로고만(상자·테두리 없이) */
.offer .co.colg, .aitem .co.colg, .card.req .co.colg { flex: none; display: inline-flex; align-items: center; padding: 0 6px 0 0; border-radius: 0; background: none; }
.co.colg img { display: block; flex: none; height: 20px; width: auto; max-width: none; }
.pname .lg { height: 16px; width: auto; vertical-align: -2px; margin-right: 8px; }
/* '자세히 ›' 접는 칸 */
details.fold { margin-top: 6px; }
details.fold > summary { list-style: none; display: inline-flex; align-items: center; gap: 4px; min-height: 44px; font-size: var(--t-small); font-weight: 600; color: var(--sub); cursor: pointer; }
details.fold > summary::-webkit-details-marker { display: none; }
details.fold > summary::after { content: "›"; font-size: 18px; line-height: 1; transition: transform .15s; }
details.fold[open] > summary::after { transform: rotate(90deg); }
details.fold .note + .note { margin-top: 6px; }
/* 새 화면이 준비됐어요(자동 업데이트): 되돌리기 알림과 같은 모양, 아래 메뉴 위 */
.updbar { position: fixed; left: 50%; bottom: calc(76px + env(safe-area-inset-bottom)); transform: translateX(-50%); width: calc(100% - 32px); max-width: 448px; display: flex; align-items: center; gap: 4px; padding: 6px 6px 6px 18px; border-radius: 14px; background: rgba(25, 31, 40, .96); color: #fff; z-index: 40; }
.updbar span { flex: 1; min-width: 0; }
.updbar b { display: block; font-size: var(--t-body); }
.updbar small { display: block; font-size: var(--t-small); color: #C9CED6; }
.updbar button { color: #7CE3C2; font-weight: 700; padding: 10px 12px; min-height: 44px; border-radius: 10px; }
.updbar .x { color: #C9CED6; padding: 10px; }
.updbar .x .ico { width: 18px; height: 18px; }
</style>

function findCatalogByName(name) {
  const raw = (name || '').toLowerCase(), n = raw.replace(/\s/g, '');
  const words = raw.replace(/([a-z0-9])([가-힣])/g, '$1 $2').replace(/([가-힣])([a-z0-9])/g, '$1 $2').split(/[^a-z0-9가-힣]+/);
  const hit = n && NAMEKEYS.find(([k, , word]) => word ? words.includes(k) : n.includes(k));
  return hit ? catalog(hit[1]) : null;
}

// 구독 찾기: 이름·다른 이름을 '|'로 이은 글자에서 찾는다. 한글은 치는 도중에도 끊기지 않게
//   초성만('ㄴㅍ' → 넷플릭스), 받침이 아직 안 붙은 글자('네' → 넷, '넷프' → 넷플), 받침이 다음 글자 첫소리가 될 글자('넹' → 네이버),
//   겹모음이 될 글자('쿠팡오' → 쿠팡와)까지 맞춘다
const subKey = x => [x.name, ...(x.keys || [])].map(keyOf).join('|');
const CHO = 'ㄱㄲㄴㄷㄸㄹㅁㅂㅃㅅㅆㅇㅈㅉㅊㅋㅌㅍㅎ', JONG = ' ㄱㄲㄳㄴㄵㄶㄷㄹㄺㄻㄼㄽㄾㄿㅀㅁㅂㅄㅅㅆㅇㅈㅊㅋㅌㅍㅎ';
const hangul = ch => { const c = (ch || '').charCodeAt(0) - 0xAC00; return c >= 0 && c < 11172 ? { cho: Math.floor(c / 588), jung: Math.floor(c % 588 / 28), jong: c % 28 } : null; };
const choOf = s => [...s].map(ch => { const h = hangul(ch); return h ? CHO[h.cho] : ch; }).join('');
const JUNG_NEXT = { 8: [9, 10, 11], 13: [14, 15, 16], 18: [19] };   // ㅗ→ㅘㅙㅚ, ㅜ→ㅝㅞㅟ, ㅡ→ㅢ
function subHit(k, q) {
  if (!q || k.includes(q)) return true;
  if (/^[ㄱ-ㅎ]+$/.test(q)) return choOf(k).includes(q);
  const head = q.slice(0, -1), last = q.slice(-1), L = hangul(last);
  const after = test => { for (let p = k.indexOf(head); p >= 0 && p < k.length; p = k.indexOf(head, p + 1)) if (test(p + head.length)) return true; return false; };   // head가 ''이면 indexOf가 끝에서 멈추므로 길이로 끊는다
  if (/[ㄱ-ㅎ]/.test(last)) return after(i => !!k[i] && choOf(k[i]) === last);
  if (!L) return false;
  const like = (h, j) => h && h.cho === L.cho && (h.jung === L.jung || (j && (JUNG_NEXT[L.jung] || []).includes(h.jung)));
  if (!L.jong) return after(i => like(hangul(k[i]), true));
  const J = JONG[L.jong];
  return CHO.includes(J) && after(i => { const h = hangul(k[i]); return like(h) && !h.jong && !!k[i + 1] && choOf(k[i + 1]) === J; });
}

// ── 실제 가격표(src/prices.json → build.js가 PRICES로 넣는다)로 계산한다. 숫자마다 출처와 확인한 날짜가 있다
// 데이터 구간: 한 달에 쓰는 양에 20%쯤 여유를 두고 고른다
const TIERS = [['7', '7GB 안팎', 5.5], ['15', '15GB 안팎', 12], ['unl', '무제한', Infinity]];
function tierOf(gb) { return gb == null || isNaN(gb) ? '' : (TIERS.find(t => gb <= t[2]) || TIERS[2])[0]; }
function tierLabel(t) { const x = TIERS.find(y => y[0] === t); return x ? x[1] : ''; }
// 화면 글자의 데이터 양 → GB ("12.3GB" → 12.3, "800MB" → 0.78, "무제한"·빈칸 → null)
function gbOf(t) {
  const m = String(t || '').replace(/,/g, '').match(/([\d.]+)\s*(GB|MB|G|M|기가)/i);
  if (!m) return null;
  const v = Number(m[1]) / (/^m/i.test(m[2]) ? 1024 : 1);
  return isFinite(v) ? Math.round(v * 100) / 100 : null;
}
// 인터넷 상품 이름 → 속도 구간 ("기가 인터넷"·"1G" → 1G, "500M" → 500M, "광랜"·"100M" → 100M, 2.5·10기가는 1G 칸으로)
function speedOf(t) {
  const s = String(t || '');
  if (/(2\.5|5|10)\s*(G|기가)|기가|1\s*G/i.test(s)) return '1G';
  if (/500\s*M/i.test(s)) return '500M';
  if (/100\s*M|광랜/i.test(s)) return '100M';
  return '';
}
// 같은 데이터 구간에서 더 싼 요금제. 부풀리지 않게 센다:
//  · 이통3사: 일반 요금제만 선택약정 25%를 받은 값(온라인 전용은 25% 못 받음)
//  · 알뜰폰: 할인이 끝난 뒤의 '보통 시세'(알뜰폰허브 요금제들의 가운데값). 더 싼 실제 상품은 예시(examples)로 따로 보여 준다
//  · 옮기는 요금제(알뜰폰·다른 통신사)는 잃는 결합 할인(loss)까지 더한 값으로 견준다. 그래서 지금 통신사 요금제(stay)도 같이 본다
function planOptions(s, prices = PRICES) {
  const P = s.phone || {}, tier = P.dataTier, M = prices.mobile || {};
  if (!P.has || !tier) return null;
  // gap = 결합할 수 있는 할인(어느 쪽이 나은지 견줄 때만), loss = 실제로 잃는 할인(아끼는 돈에서 뺀다: 지금 받거나, 옮기기 전에 받게 될 것)
  const keep = bundleKeep(s, prices), real = bundleReal(s, keep), cost = o => o.price + o.gap;
  const moveOf = o => (o.kind === '알뜰폰' || P.carrier === '알뜰폰' ? true : P.carrierName ? o.carrier !== P.carrierName : null);   // 통신사를 모르면 null
  const withLoss = o => { const move = moveOf(o), off = move || o.noBundle; return { ...o, move, gap: off ? keep : 0, loss: off ? real : 0 }; };
  const all = (M.mno || []).filter(p => p.tier === tier).map(p => withLoss({ ...p, kind: '이통3사', price: p.sel25 ? round10(p.monthly * 0.75) : p.monthly })).sort((a, b) => cost(a) - cost(b));
  const mno = all[0], stay = all.find(p => p.move === false);   // 지금 통신사에서 가장 싼 것(결합 할인이 풀리는 요금제면 그만큼 더해서)
  const t = (M.mvnoTypical || {})[tier];
  const mvno = t && withLoss({ id: 'mvno-' + tier, kind: '알뜰폰', company: '알뜰폰', name: `${t.data || tierLabel(tier)} 요금제 보통 시세`, price: t.after, monthly: t.promo, after: t.after, promo: t.promoMonths || '몇 달', data: t.data || tierLabel(tier), url: M.mvnoUrl, typical: true });
  const base = P.sel === 'none' ? round10(P.fee * 0.75) : P.fee;   // 선택약정을 먼저 받는다고 보고, 그보다 더 아끼는 만큼만 센다(두 번 세지 않게)
  const opts = [mno, stay !== mno ? stay : null, mvno].filter(Boolean).sort((a, b) => cost(a) - cost(b));
  const examples = (M.mvno || []).filter(p => p.tier === tier).map(p => ({ ...p, kind: '알뜰폰', price: p.after || p.monthly })).sort((a, b) => a.price - b.price);
  return { tier, base, opts, examples, save: opts.length ? Math.max(0, base - opts[0].price - opts[0].loss) : 0 };
}
// 통신사 묶음(휴대폰 SKT ↔ 인터넷 SK브로드밴드처럼 같은 곳끼리만 결합된다)
const coOf = c => (/SK/i.test(c || '') ? 'SK' : /KT/i.test(c || '') ? 'KT' : /LG|유플/i.test(c || '') ? 'LG' : '');
const sameCo = (P, N) => !N.carrier || !P.carrierName || coOf(N.carrier) === coOf(P.carrierName);   // 모르면 같다고 본다
// 옮기면(번호이동) 잃는 결합 할인: 결합 중이면 그 할인, 안 했거나 모르면 남아서 결합할 때 받을 할인(옮기면 못 받는다)
// 휴대폰과 인터넷이 다른 통신사라 결합할 수 없을 때만 0
function bundleKeep(s, prices = PRICES) {
  const P = s.phone || {}, N = s.net || {};
  const b = P.has && P.carrier === '이통3사' && N.has ? bundleOf(P.carrierName, prices) : null;
  return b && (P.bundle === 'yes' || sameCo(P, N)) ? b.monthly : 0;
}
// 그중 실제로 잃는 돈: 지금 결합 중이거나, 약정 중이라 옮기기 전에 결합부터 할 사람(안 했거나 모르면 0 — 아끼는 돈을 줄여 말하지 않게)
function bundleReal(s, keep) {
  const P = s.phone || {}, locked = P.contract === 'active' && daysUntil(P.contractEnd) > 0;
  return keep && (P.bundle === 'yes' || (locked && P.bundle === 'no')) ? keep : 0;
}
// 통신사 대표 결합 할인(휴대폰 1회선 + 인터넷). 통신사를 모르면 세 곳 중 가장 작은 값으로(부풀리지 않게)
function bundleOf(name, prices = PRICES) {
  const list = prices.bundle || [];
  return list.find(b => b.carrier === name) || (list.length ? { ...list.reduce((a, b) => (b.monthly < a.monthly ? b : a)), carrier: '', name: '통신사 결합 할인' } : null);
}

// 인터넷·TV 3년 총액: 지금 요금 그대로 vs 통신사 세 곳의 공식 3년 약정 요금(가격표). 사은품은 가입처마다 달라 정해진 값이 있을 때만 뺀다
function compare3y(s, prices = PRICES, useWant = false) {   // useWant: 3년 비교 화면에서 고른 '인터넷만 / 인터넷+TV'로 견줄 때(새는 돈·홈 카드는 지금 쓰는 그대로)
  if (!s.net || !s.net.has) return null;
  // tv: 견줄 상품(지금 쓰는 것 · 3년 비교에서 '인터넷만 / 인터넷+TV'로 바꿀 수 있음 = s.net.want). 지금 요금은 실제로 내는 그대로
  const tv = useWant && s.net.want ? s.net.want === 'tv' : !!s.net.tv, curMonthly = netFee(s) + tvFee(s);
  // 가입 사은품(예시 금액, 제휴처 금액표가 오면 바꾼다): 다른 회사로 새로 가입할 때만 · 지금 회사 재약정에는 없다
  //   지금 회사를 모르면(처음 고르기에서는 안 물어봄) 재약정일 수도 있어서 계산에 넣지 않고, 화면에 '옮기면 받는 사은품'으로만 보여 준다
  const G = prices.gift || {}, known = !!s.net.carrier, mineOf = o => !!coOf(s.net.carrier) && coOf(o.carrier) === coOf(s.net.carrier);
  const giftOf = o => (mineOf(o) ? 0 : (((tv ? G.tv : G.net) || {})[o.carrier] || {})[o.speed || '500M'] || 0);   // 회사 · TV 여부 · 속도별
  const all = prices.internet || [], speed = s.net.speed || '500M';   // 속도를 모르면 가장 흔한 500M로
  const rows = all.some(o => (o.speed || '500M') === speed) ? all.filter(o => (o.speed || '500M') === speed) : all.filter(o => (o.speed || '500M') === '500M');
  // 인터넷을 휴대폰과 다른 회사로 옮기면 결합 할인이 풀리거나(loss, 총액에 더함) 못 받는다(gap, 견줄 때만)
  const keep = bundleKeep(s, prices), real = bundleReal(s, keep), home = coOf(s.net.carrier) || (keep ? coOf((s.phone || {}).carrierName) : '');   // 결합할 수 있으면 인터넷도 휴대폰과 같은 곳
  const offers = rows.map(o => ({ id: o.id, title: o.carrier + ' ' + (tv ? o.tvName || o.name : o.name), carrier: o.carrier, speed: o.speed || '500M', monthly: tv ? o.tvMonthly : o.monthly, netOnly: o.monthly, support: known ? giftOf(o) : 0, giftIf: giftOf(o), mine: mineOf(o), url: o.url }))
    .filter(o => o.monthly > 0).map(o => { const off = keep && home && coOf(o.carrier) !== home; return { ...o, gap: off ? keep : 0, loss: off ? real : 0, total: (o.monthly + (off ? real : 0)) * 36 - o.support }; });
  if (!offers.length) return null;
  const cur = { title: '지금 그대로 쓰면', monthly: curMonthly, support: 0, total: curMonthly * 36 };
  const best = offers.reduce((a, b) => (b.total + b.gap * 36 < a.total + a.gap * 36 ? b : a));
  // 케이블 인터넷은 지역에 따라 못 쓰는 곳이 있어 '아끼는 돈'에는 넣지 않고 따로 보여 준다 (TV 없이 인터넷만 쓸 때)
  const cable = tv ? [] : (prices.cable || []).filter(o => o.speed === speed).map(o => ({ id: o.id, title: o.carrier + ' ' + o.name, carrier: o.carrier, monthly: o.monthly, support: 0, url: o.url, memo: o.memo, total: o.monthly * 36 }));
  const gift = Math.max(0, ...offers.map(o => o.support));   // 가장 큰 사은품(0이면 사은품 없이 계산)
  return { cur, offers, best, gift, giftDemo: !!G.demo, known, tv, cable, save3y: Math.max(0, cur.total - best.total) };
}

// 새는 돈 찾기 (규칙). amount = 매달 아낄 수 있는 돈. sure=false 는 '확인하면' 금액
function findLeaks(s, prices = PRICES) {
  const L = [];
  const P = s.phone || {}, N = s.net || {};
  const subs = s.subs || [];
  if (P.has && P.fee > 0) {
    if (P.sel === 'none') L.push({ id: 'sel', icon: 'phone', title: '선택약정 할인이 빠졌어요', desc: '신청하면 휴대폰 요금 25% 할인', amount: round10(P.fee * 0.25), sure: true, act: 'sel' });
    else if (P.sel === 'unknown') L.push({ id: 'sel?', icon: 'phone', title: '선택약정 할인을 받고 있나요?', desc: '안 받고 있다면 매달 25%를 더 내는 중이에요', amount: round10(P.fee * 0.25), sure: false, act: 'selq' });
    // 쓰는 데이터보다 비싼 요금제 → 같은 데이터로 더 싼 요금제(가격표의 실제 요금제)
    const done = P.deviceLeft === 0 ? '기계값 할부도 끝나 바꾸기 좋아요' : '';
    const po = planOptions(s, prices);
    if (!P.dataTier) L.push({ id: 'plan?', icon: 'phone', title: '한 달에 데이터를 얼마나 써요?', desc: (done ? done + ' · ' : '') + '알려 주시면 같은 데이터로 더 싼 요금제를 찾아요', amount: 0, sure: false, act: 'planq' });
    else if (po && po.save >= 3000) {
      const o = po.opts[0], later = o.move !== false && P.contract === 'active' && daysUntil(P.contractEnd) > 0;   // 약정 중에 옮기면 위약금 → 약정이 끝난 뒤로
      L.push({ id: 'plan', icon: 'phone', title: `${tierLabel(po.tier)}면 더 싼 요금제가 있어요`, desc: `${o.kind} ${o.company || o.carrier} ${o.name} 월 ${won(o.price)}원${o.loss ? ` · 결합 할인 ${won(o.loss)}원 빠진 값` : ''}${done ? ' · ' + done : ''}`, amount: po.save, sure: true, act: 'plan', move: o.move, later });
    }
    const paid = (P.addons || []).filter(x => x.fee > 0);
    if (paid.length) L.push({ id: 'addon', icon: 'phone', title: paid.length === 1 ? josa(paid[0].name, '이', '가') + ' 매달 나가요' : '부가서비스 ' + paid.length + '개가 매달 나가요', desc: '안 쓰면 통신사 앱 › 부가서비스에서 바로 끌 수 있어요', amount: paid.reduce((a, x) => a + x.fee, 0), sure: true, act: 'addon' });
    // 휴대폰·인터넷 결합 할인. 옮기는 요금제를 권하면 묻지 않는다(옮기면 결합이 풀림). 단 옮기는 게 약정 뒤라면 그 전까지 결합부터
    const pl = L.find(x => x.id === 'plan');
    const b = P.carrier === '이통3사' && N.has && P.bundle !== 'yes' && sameCo(P, N) && (!pl || pl.move === false || pl.later) ? bundleOf(P.carrierName, prices) : null;
    if (b && P.bundle === 'no') L.push({ id: 'bundle', icon: 'router', title: '휴대폰·인터넷 결합 할인이 없어요', desc: `${b.name} · 같은 통신사로 묶으면 매달 할인돼요`, amount: b.monthly, sure: true, act: 'bundle' });
    else if (b) L.push({ id: 'bundle?', icon: 'router', title: '휴대폰과 인터넷, 묶어서 할인받고 있어요?', desc: '같은 통신사로 묶으면 매달 할인돼요', amount: b.monthly, sure: false, act: 'bundleq' });
  }
  if (N.has) {
    const c = compare3y(s, prices);
    const d = daysUntil(N.contractEnd);
    const what = N.tv ? '인터넷·TV' : '인터넷';
    if (d === null) L.push({ id: 'net?', icon: 'router', title: '인터넷 약정이 언제 끝나요?', desc: '끝나는 때가 재약정 할인이나 갈아타기 사은품을 받을 기회예요', amount: 0, sure: false, act: 'netq' });
    else if (d <= 90 && c && c.save3y > 0) L.push({ id: 'net', icon: 'router', title: `${what} 약정이 ${d < 0 ? '끝났어요' : '곧 끝나요'}`, badge: d < 0 ? '약정 끝남' : '약정 D-' + d, desc: '공식 요금으로 바꾸면 3년에 ' + won(c.save3y) + '원 아껴요' + (c.best.support ? ` (${c.giftDemo ? '예시 ' : ''}사은품 포함)` : ' (사은품 빼고)'), amount: round10(c.save3y / 36), sure: true, act: 'compare', save3y: c.save3y });
    // 요금은 이미 공식 최저 수준: 지어낸 금액 없이, 재약정 할인·사은품을 챙길 때라고만 알린다
    else if (d <= 90 && c) L.push({ id: 'netEnd', icon: 'router', title: `${what} 약정이 ${d < 0 ? '끝났어요' : '곧 끝나요'}`, badge: d < 0 ? '약정 끝남' : '약정 D-' + d, desc: '요금은 지금도 공식 최저 수준이에요 · 재약정 할인이나 갈아타기 사은품을 챙기세요', amount: 0, sure: false, act: 'compare' });
  }
  // 요금제에 들어 있는 구독을 따로 결제 (통신과 구독을 같이 봐야만 찾는 것)
  for (const bn of P.has ? (P.benefits || []) : []) {
    const c = findCatalogByName(bn), x = c && subs.find(y => y.id === c.id && y.status !== 'cancel');
    if (x && !L.some(y => y.id === 'inc-' + x.id)) L.push({ id: 'inc-' + x.id, icon: 'play', title: `요금제에 ${josa(x.name, '이', '가')} 들어 있어요`, desc: `따로 내는 ${eul(x.name)} 해지해도 돼요`, amount: x.fee, sure: true, act: 'included', sub: x.id });
  }
  const cancels = (s.subs || []).filter(x => x.status === 'cancel');
  if (cancels.length) {
    const names = cancels.map(x => x.name).join(', ');
    L.push({ id: 'unused', icon: 'play', title: cancels.length === 1 ? cancels[0].name + (cancels[0].note ? ', ' + cancels[0].note : ' 해지하기로 했어요') : '해지할 구독 ' + cancels.length + '개', desc: cancels.length === 1 ? '해지하면 다음 결제부터 안 나가요' : names, amount: cancels.reduce((a, x) => a + x.fee, 0), sure: true, act: 'cancel', ids: cancels.map(x => x.id) });
  }
  const live = id => subs.find(x => x.id === id && x.status !== 'cancel');
  const claimed = new Set(L.filter(x => x.sub).map(x => x.sub));   // 이미 다른 알림에 든 구독은 두 번 세지 않는다
  const yt = live('youtube') || live('udok');   // 유독 더블 스트리밍에도 유튜브 프리미엄이 들어 있다
  const music = subs.filter(x => x.status !== 'cancel' && !claimed.has(x.id) && (catalog(x.id) || {}).cat === 'music');
  if (yt && music.length) {
    L.push({ id: 'overlap', icon: 'music', title: '음악 구독이 겹쳐요', desc: `${yt.name}에 유튜브 뮤직이 들어 있어요. ` + eul(music.map(x => x.name).join(', ')) + ' 빼도 돼요', amount: music.reduce((a, x) => a + x.fee, 0), sure: true, act: 'overlap', ids: music.map(x => x.id) });
    music.forEach(x => claimed.add(x.id));
  }
  // 멤버십에 들어 있는 다른 구독을 따로 결제 (가격표 includes: 출처가 있는 것만). 조건이 있으면 '확인하면'
  // [id, 추가요금]은 같은 등급을 쓰려면 더 내는 돈(아끼는 돈에서 뺀다), pick은 여러 개 중 하나만 받을 수 있음(가장 많이 아끼는 것만)
  for (const inc of prices.includes || []) {
    const host = live(inc.from); if (!host) continue;
    let dup = (inc.covers || []).map(c => { const [id, extra = 0] = [].concat(c), x = live(id); return x && !claimed.has(id) ? { x, save: Math.max(0, x.fee - extra) } : null; }).filter(Boolean);
    if (inc.pick) dup = dup.sort((a, b) => b.save - a.save).slice(0, inc.pick);
    if (!dup.length) continue;
    dup.forEach(d => claimed.add(d.x.id));
    L.push({ id: 'inc2-' + (inc.id || inc.from), icon: 'play', title: `${host.name}에 ${josa(dup.map(d => d.x.name).join(', '), '이', '가')} 들어 있어요`, desc: inc.note, amount: dup.reduce((a, d) => a + d.save, 0), sure: !inc.cond, act: 'overlap2', ids: dup.map(d => d.x.id), from: inc.from });
  }
  return L.filter(x => !(s.dismissed || {})[x.id]);
}
function leakSum(L, sure = true) { return L.filter(x => x.sure === sure).reduce((a, x) => a + (x.amount || 0), 0); }
function savedSum(s) { return (s.done || []).reduce((a, x) => a + (x.amount || 0), 0); }

// ── 컨설팅: 새는 돈을 '할 일 순서'로 바꾼다. 무엇을 · 언제(지금 / 날짜가 되면 / 확인하면) · 얼마나 걸리는지 · 주의할 점 · 다른 길
// 순서: 지금 할 일은 1분에 아끼는 돈이 큰 것부터(쉽고 많이 아끼는 것 먼저), 날짜가 있는 일은 시작일 순, 확인할 일은 큰 금액부터
// 금액은 새는 돈(findLeaks)을 그대로 나눠 담아 합이 같다. 선택약정과 요금제 바꾸기는 한 번에 정할 일이라 하나로 묶는다
const STEP_MIN = { sel: 5, stay: 5, stayOnline: 20, move: 30, addon: 3, bundle: 15, net: 30, netRe: 15, netEnd: 15, cancel: 2, included: 2, overlap: 2, overlap2: 3, ask: 1 };   // 보통 걸리는 시간(분)
const STEP_HOW = { sel: '통신사 앱이나 114', stay: '통신사 앱', stayOnline: '통신사 온라인샵', move: '유심 받는 데 1~2일', addon: '통신사 앱', bundle: '전화나 매장', net: '설치 기사 방문', netRe: '전화 한 통', netEnd: '전화 한 통', cancel: '앱에서', included: '앱에서', overlap: '앱에서', overlap2: '앱에서' };
function planOf(s, prices = PRICES) {
  const L = findLeaks(s, prices), P = s.phone || {}, N = s.net || {};
  const sel = L.find(x => x.id === 'sel'), plan = L.find(x => x.id === 'plan'), o = plan ? planOptions(s, prices).opts[0] : null;
  const subName = id => ((s.subs || []).find(x => x.id === id) || {}).name || '';
  const lockOf = ids => (ids || []).map(id => [subName(id), (catalog(id) || {}).lock]).filter(([, l]) => l).map(([n, l]) => `${n}: ${l}`);
  const what = N.tv ? '인터넷·TV' : '인터넷', dNet = daysUntil(N.contractEnd);
  const steps = [];
  for (const x of L) {
    if (x === sel && plan) continue;   // 요금제를 바꾸면 선택약정은 그 안에서 같이 정한다(따로 했다가 옮기면 위약금)
    const st = { id: x.id, leak: x, kind: x.sure || x.amount === 0 ? x.act : 'ask', title: x.title, desc: x.desc, amount: x.amount, sure: x.sure, when: x.sure && x.amount > 0 ? 'now' : 'ask', date: '', warns: [], alt: '' };
    if (x === plan) {
      const mv = o.move !== false, online = /온라인 전용/.test(o.name || '');   // 온라인 전용은 앱의 요금제 변경이 아니라 온라인샵에서 가입
      st.kind = mv ? 'move' : online ? 'stayOnline' : 'stay';
      st.title = o.move === null ? '더 싼 요금제로 바꾸기' : !mv ? '요금제 바꾸기' : o.kind === '알뜰폰' ? (P.carrier === '알뜰폰' ? '다른 알뜰폰으로 옮기기' : '알뜰폰으로 옮기기') : ro(o.carrier) + ' 옮기기';
      st.desc = `${o.kind === '알뜰폰' ? o.name : o.carrier + ' ' + o.name} · 월 ${won(o.price)}원`;
      if (o.move === null) st.warns.push(`지금 통신사가 ${o.carrier}가 아니면 번호이동이에요`);
      const stay = mv && planOptions(s, prices).opts.find(y => y.move === false);   // 옮기기 싫을 때 지금 통신사에서 고를 수 있는 것
      if (stay) st.alt = `안 옮기려면 ${stay.carrier} ${stay.name} 월 ${won(stay.price)}원도 있어요 · 월 ${won(stay.price + stay.loss - o.price - o.loss)}원 차이`;
      if (sel) {
        st.amount += sel.amount;
        if (mv) { if (!stay) st.alt = `안 옮기려면 선택약정만 신청해도 매달 ${won(sel.amount)}원 아껴요`; st.warns.push('옮길 거면 선택약정은 따로 신청하지 마세요 · 옮길 때 위약금이 생겨요'); }
        else st.desc += o.sel25 ? ' · 바꾼 뒤 선택약정 25% 신청' : ' · 선택약정 없이 이 값';
      }
      if (o.loss) st.warns.push(P.bundle === 'yes' ? `지금 받는 결합 할인 월 ${won(o.loss)}원이 사라져요 · 빼고 계산했어요` : `옮기기 전에 받을 결합 할인 월 ${won(o.loss)}원은 옮길 때 사라져요 · 빼고 계산했어요`);
      else if (o.gap && !P.bundle) st.warns.push(`휴대폰·인터넷 결합 할인을 받고 있다면 ${mv ? '옮길' : '바꿀'} 때 월 ${won(o.gap)}원쯤 사라져요`);
      else if (o.gap) st.warns.push(`이 요금제로는 휴대폰·인터넷 결합 할인(월 ${won(o.gap)}원)을 받을 수 없어요`);
      else if (mv && P.carrier === '이통3사' && N.has && !P.bundle) { const b = bundleOf(P.carrierName, prices); if (b) st.warns.push(`휴대폰·인터넷 결합 할인을 받고 있다면 옮길 때 월 ${won(b.monthly)}원쯤 사라져요`); }
      if (!mv && online) st.warns.push('온라인 전용이라 앱의 요금제 변경으로는 안 돼요 · 통신사 온라인샵에서 가입해요');
      if ((mv || online) && P.deviceLeft > 0) st.warns.push(`기계값 할부가 ${P.deviceLeft}개월 남았어요 · ${mv ? '옮겨도' : '바꿔도'} 할부금은 그대로 나가요`);
      if ((mv || online) && (P.contract === 'unknown' || (P.contract === 'active' && !plan.later))) st.warns.push('약정이 남았는지 먼저 확인하세요 · 남았으면 위약금이 있어요');
      if (!mv && !online && P.contract === 'active' && P.sel !== 'applied') st.warns.push('기계값 지원금을 받고 6개월이 안 됐으면, 요금제를 낮출 때 지원금 차액을 낼 수 있어요');
      if (o.kind === '알뜰폰') st.warns.push(`알뜰폰 할인은 보통 ${o.promo} 뒤 끝나요 · 끝난 뒤 요금으로 계산했어요`);
      if (plan.later) { st.when = 'date'; st.date = P.contractEnd; st.warns.unshift(`약정이 ${md(P.contractEnd)}에 끝나요 · 그 뒤에 옮기면 위약금이 없어요`); }
    } else if (x.id === 'sel') st.title = '선택약정 25% 할인 신청';
    else if (x.id === 'addon') st.title = '부가서비스 끄기';
    else if (x.id === 'bundle') { st.title = '휴대폰·인터넷 결합 할인 신청'; if (plan && plan.later) st.warns.push(`${md(P.contractEnd)}에 옮기기 전까지 받는 할인이에요`); }
    else if (x.id === 'net' || x.id === 'netEnd') {
      st.kind = x.id; st.title = `${what} 재약정 할인 받기`;
      if (x.id === 'net') {   // 같은 회사 공식 요금이 가장 싸면 '재약정', 다른 회사면 '바꾸기'
        const c = compare3y(s, prices), b = c.best, home = coOf(N.carrier), re = home && coOf(b.carrier) === home;
        st.title = re ? `${what} 재약정하기` : `${what} ${ro(b.carrier)} 바꾸기`;
        if (re) st.kind = 'netRe';   // 같은 회사는 설치 없이 전화로
        st.desc = `${b.title} 월 ${won(b.monthly)}원 · 3년에 ${won(c.save3y)}원 아껴요${b.support ? ` (${c.giftDemo ? '예시 ' : ''}사은품 ${won(b.support / 10000)}만 원 포함)` : ''}`;
      } else st.desc = '지금 요금이 공식 최저 수준이에요 · 전화로 재약정 할인이나 사은품을 물어보세요';
      st.when = dNet > 30 ? 'date' : 'now';
      if (dNet > 30) { st.date = shiftYmd(N.contractEnd, -30); st.warns.push(`약정이 ${md(N.contractEnd)}에 끝나요 · 한 달 전부터 알아보고, 끝난 뒤에 해지하세요`); }
      else if (dNet >= 0) st.warns.push(`약정이 ${md(N.contractEnd)}에 끝나요 · 끝난 뒤에 해지해야 위약금이 없어요`);
    } else if (x.id === 'unused') { st.title = x.ids.length === 1 ? subName(x.ids[0]) + ' 해지' : `구독 ${x.ids.length}개 해지`; st.warns.push(...lockOf(x.ids)); }
    else if (x.id.startsWith('inc-')) { st.title = subName(x.sub) + ' 해지'; st.desc = '요금제에 이미 들어 있어요'; }
    else if (x.id === 'overlap' || x.id.startsWith('inc2-')) { st.title = x.ids.map(subName).join(', ') + ' 해지'; st.warns.push(...lockOf(x.ids)); }
    st.min = STEP_MIN[st.kind] * (x.ids && st.kind !== 'ask' ? x.ids.length : 1) + (st.kind === 'stay' && o.sel25 && sel ? STEP_MIN.sel : 0);
    st.how = STEP_HOW[st.kind] || '';
    steps.push(st);
  }
  const rank = x => x.amount / (x.min || 5);
  const now = steps.filter(x => x.when === 'now').sort((a, b) => rank(b) - rank(a) || b.amount - a.amount);
  const later = steps.filter(x => x.when === 'date').sort((a, b) => (a.date < b.date ? -1 : a.date > b.date ? 1 : 0));
  const ask = steps.filter(x => x.when === 'ask').sort((a, b) => b.amount - a.amount);
  const all = [...now, ...later, ...ask];
  all.forEach((x, i) => { x.no = i + 1; });
  return { now, later, ask, steps: all, sure: [...now, ...later].filter(x => x.sure).reduce((a, x) => a + x.amount, 0), more: ask.reduce((a, x) => a + (x.amount || 0), 0), next: nextCheck(s, later) };
}
// 다음 점검일: 날짜가 있는 할 일 중 가장 빠른 날 → 약정·할부가 끝나기 전 → 없으면 한 달 뒤
function nextCheck(s, later = []) {
  const t = ymd(today()), P = s.phone || {}, N = s.net || {};
  const c = later.map(x => [x.date, x.title]);
  if (N.has && N.contractEnd) c.push([shiftYmd(N.contractEnd, -30), '인터넷 약정 끝나기 한 달 전'], [N.contractEnd, '인터넷 약정 끝나는 날']);
  if (P.has && P.contract === 'active' && P.contractEnd) c.push([shiftYmd(P.contractEnd, -30), '휴대폰 약정 끝나기 한 달 전'], [P.contractEnd, '휴대폰 약정 끝나는 날']);
  if (P.has && P.deviceEnd) c.push([P.deviceEnd, '기계값 할부가 끝나는 달']);
  const f = c.filter(([d]) => d && d > t).sort((a, b) => (a[0] < b[0] ? -1 : 1))[0];
  return f ? { date: f[0], why: f[1] } : { date: shiftYmd(t, 30), why: '한 달에 한 번 점검' };
}

// 구독 성향(공유 카드용, 규칙)
function subsType(s) {
  const subs = s.subs || [];
  const video = subs.filter(x => (catalog(x.id) || {}).cat === 'video').length;
  const music = subs.filter(x => (catalog(x.id) || {}).cat === 'music' || x.id === 'youtube').length;
  if (subs.filter(x => (catalog(x.id) || {}).cat === 'ai').length >= 2) return 'AI 얼리어답터형';
  if (video >= 3) return 'OTT 과몰입형';
  if (music >= 2) return '음악 중복형';
  if (subs.length <= 2) return '미니멀형';
  return '알뜰 관리형';
}

// 다가오는 날짜(알림 탭·내 캘린더). desc는 캘린더 메모, repeat는 매달 반복
function upcoming(s) {
  const E = [];
  const N = s.net || {};
  if (N.has && N.contractEnd) E.push({ kind: 'net', date: N.contractEnd, d: daysUntil(N.contractEnd), title: '인터넷' + (N.tv ? '·TV' : '') + ' 약정 끝나는 날', desc: '끝나기 30일 전부터 갈아타면 위약금 걱정이 없어요', go: '#compare' });
  const P = s.phone || {};
  if (P.has && P.contract === 'active' && P.contractEnd) E.push({ kind: 'phone', date: P.contractEnd, d: daysUntil(P.contractEnd), title: '휴대폰 약정 끝나는 날', desc: '끝나면 선택약정 25% 할인을 다시 신청하세요', go: '#leaks' });
  if (P.has && P.deviceEnd && daysUntil(P.deviceEnd) >= 0) E.push({ kind: 'device', date: P.deviceEnd, d: daysUntil(P.deviceEnd), title: '기계값 할부 끝나는 달', desc: '이제 요금제를 낮추거나 알뜰폰으로 바꿔도 돼요', go: '#leaks' });
  const t = today();
  for (const x of s.subs || []) {
    if (x.trialEnd) E.push({ kind: 'trial', date: x.trialEnd, d: daysUntil(x.trialEnd), title: x.name + ' 무료 체험 끝나는 날', desc: '끝나면 월 ' + won(x.fee) + '원이 결제돼요', sub: x });
    if (!x.day) continue;
    const date = nextPayDate(x.day, t);
    E.push({ kind: 'sub', date, d: daysUntil(date), title: x.name + ' 결제일', desc: '매달 ' + x.day + '일 · ' + won(x.fee) + '원' + (x.status === 'cancel' ? ' · 해지하기로 함' : ''), sub: x, repeat: 'FREQ=MONTHLY' });
  }
  return E.sort((a, b) => a.d - b.d);
}

// 폰 알림 목록: 그날 아침 9시쯤 폰이 보낸다(안드로이드). route = 알림을 누르면 열 화면
// 약정은 30일·7일 전과 당일, 무료 체험은 이틀 전과 당일, '해지하기로 한' 구독은 결제 전날
function reminders(s, base = today()) {
  const R = [], t = ymd(base), N = s.net || {}, P = s.phone || {};
  const add = (day, before, id, title, body, route) => { const date = shiftYmd(day, -before); if (date >= t) R.push({ id, date, title, body, route }); };
  if (N.has && N.contractEnd) for (const k of [30, 7, 0]) add(N.contractEnd, k, 'net-' + k, k ? `인터넷 약정이 ${k}일 뒤 끝나요` : '오늘 인터넷 약정이 끝나요', '지금 갈아타면 위약금 없이 더 싸게 바꿀 수 있어요', '#compare');
  if (P.has && P.contract === 'active' && P.contractEnd) for (const k of [30, 0]) add(P.contractEnd, k, 'phone-' + k, k ? `휴대폰 약정이 ${k}일 뒤 끝나요` : '오늘 휴대폰 약정이 끝나요', '약정이 끝나면 선택약정 25% 할인을 다시 신청하세요', '#leaks');
  if (P.has && P.deviceEnd) add(P.deviceEnd, 0, 'device-0', '이번 달부터 기계값 할부가 없어요', '이제 요금제를 낮추거나 알뜰폰으로 바꿔도 돼요', '#leaks');
  for (const x of s.subs || []) {
    if (x.trialEnd) for (const k of [2, 0]) add(x.trialEnd, k, `trial-${x.id}-${k}`, k ? `${x.name} 무료 체험이 모레 끝나요` : `오늘 ${x.name} 무료 체험이 끝나요`, `계속 안 쓸 거면 미리 해지하세요 · 끝나면 월 ${won(x.fee)}원`, '#alerts');
    if (x.status === 'cancel' && x.day) add(nextPayDate(x.day, base), 1, 'pay-' + x.id, `내일 ${x.name} ${won(x.fee)}원이 결제돼요`, '해지하기로 하셨죠? 오늘 해지하면 안 나가요', '#leaks');
  }
  return R.sort((a, b) => (a.date < b.date ? -1 : a.date > b.date ? 1 : 0));
}

// 캘린더 파일(.ics, PC·아이폰용): 그날 9시 일정 + 미리 알림(약정 7일 전, 그 밖은 1일 전). 매달 결제일은 매달 반복
function icsOf(events, stamp) {
  const esc = t => String(t || '').replace(/[\\;,]/g, m => '\\' + m).replace(/\r?\n/g, '\\n');
  const fold = line => {   // 한 줄 75바이트를 넘으면 접는다(캘린더 파일 규칙)
    const out = []; let cur = '', bytes = 0;
    for (const ch of line) { const b = new TextEncoder().encode(ch).length; if (bytes + b > 74) { out.push(cur); cur = ' ' + ch; bytes = 1 + b; } else { cur += ch; bytes += b; } }
    out.push(cur); return out.join('\r\n');

const FORMKEY = 'gjbs.formUrl', FORM_RE = /^https:\/\/script\.google\.com\/macros\/s\/[A-Za-z0-9_-]{20,}\/exec$/;
const okFormUrl = u => FORM_RE.test(u) || /^http:\/\/127\.0\.0\.1:\d+\/form$/.test(u);
function formUrl() {   // 설정에 넣은 주소 → 폰 앱(APK 안) → PC 파일 순
  let u = ''; try { u = localStorage.getItem(FORMKEY) || ''; } catch (e) { }
  if (!u && Android && Android.formUrl) try { u = Android.formUrl() || ''; } catch (e) { }
  u = u || FORM_URL; return okFormUrl(u) ? u : '';
}
// 받는 곳에 보내기 → 'ok' | 'fail'. 내용은 주소가 아니라 본문으로만 보낸다(개인정보를 주소에 넣지 않음)
//   PC 브라우저가 답을 못 읽게 막아도(CORS) 보내기는 되므로 한 번 더 보내고 'ok'로 본다(받는 곳이 신청번호로 두 번 적지 않음)
function postForm(url, body) {
  const h = { 'Content-Type': 'text/plain;charset=utf-8' }, good = (st, t) => st >= 200 && st < 400 && !/"ok"\s*:\s*false/.test(t);
  if (Android && Android.post) return httpPost(url, h, body, 30000).then(r => (good(r.status, r.text) ? 'ok' : 'fail'), () => 'fail');
  return fetch(url, { method: 'POST', headers: h, body }).then(async r => (good(r.status, await r.text()) ? 'ok' : 'fail'))
    .catch(() => fetch(url, { method: 'POST', mode: 'no-cors', headers: h, body }).then(() => 'ok', () => 'fail'));
}

function saveImage(dataUrl, name) {
  const b64 = dataUrl.split(',')[1];
  if (Android && Android.saveImage) return Android.saveImage(b64, name) ? 'saved' : 'fail';
  const a = document.createElement('a'); a.href = dataUrl; a.download = name; a.click();
  return 'saved';
}
async function shareImage(dataUrl, name, title = '고정비 영수증') {
  const b64 = dataUrl.split(',')[1];
  if (Android && Android.shareImage) { Android.shareImage(b64, name); return; }
  try {
    const blob = await (await fetch(dataUrl)).blob();
    const file = new File([blob], name, { type: 'image/png' });
    if (navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file], title }); return; }
  } catch (e) { }
  saveImage(dataUrl, name);
  toast('이 브라우저는 바로 보내기가 안 돼서 사진으로 저장했어요');
}

function planCard(o, po, main) {

    <div class="save">${net > 0 ? `지금보다 매달 ${won(net)}원 아껴요` : '지금과 비슷해요'}</div>

// 요금제 카드의 버튼: 옮기는 요금제는 고정비서가 신청을 받고(판매), 온라인 전용은 통신사만 팔아서 링크 없이 '직접 가입했어요'만,
// 같은 통신사 일반 요금제는 앱에서 직접 바꾼 뒤 '바꿨어요'
const onlineOnly = o => /온라인 전용/.test(o.name || '');
const sellable = o => o.move !== false && !onlineOnly(o);
// 앞세울 '고정비서로 신청' 하나: 가장 싼 게 온라인 전용이라 어차피 옮겨야 하면, 아끼는 돈이 그것의 90% 이상인 팔 수 있는 요금제를 앞세운다
// 지금 통신사에 남는 게 가장 싸면(옮길 필요 없음) 그대로 둔다 · 값 순서와 '가장 싼' 자리는 바꾸지 않고, 차이는 카드에 적는다
const planSave = o => S.phone.fee - o.price - (o.loss || 0);   // 지금 실제로 내는 요금과 견준다(할 일 카드와 같은 값) · 옮기면 잃는 결합 할인까지 뺀다
function sellPick(po) {

/* 고정비서 — 캡처 자동 인식. 금액은 '두 번 읽기 + 코드 검산'을 통과한 것만 넣는다.
   1단계: Opus 5.5가 화면 전체를 읽으며 금액마다 화면 위치(box)를 적는다.
   2단계: 그 위치만 잘라 크게 키워 다시 읽힌다(앞 결과를 보여 주지 않음). 두 값과 화면 글자 그대로의 숫자가 모두 같아야 '확인됨'.
   다르면 넣지 않고, 잘라 낸 조각을 보여 주며 사용자에게 묻는다. 절약 계산은 AI가 아니라 data.js 코드가 한다. */
const AI_MODEL = 'claude-opus-5-5';
const API_URL = 'https://api.anthropic.com/v1/messages';
let CAP = null;   // { images:[{dataUrl,w,h,canvas}], sample:'phone'|'card'|null, result, busy, cancelled }

const ROLES = ['plan_fee', 'addon', 'discount', 'bill_total', 'device_installment', 'internet_fee', 'tv_fee', 'subscription', 'row', 'statement_total', 'other'];
const READ_SCHEMA = {
  type: 'object', additionalProperties: false,
  required: ['kind', 'provider', 'plan_name', 'selective_discount', 'bundle_discount', 'contract_status', 'contract_end', 'data_used', 'data_quota', 'plan_benefits', 'device_months_left', 'items', 'notes'],
  properties: {
    kind: { type: 'string', enum: ['phone', 'internet', 'card', 'appstore', 'other'] },
    provider: { type: 'string' }, plan_name: { type: 'string' },
    data_used: { type: 'string' }, data_quota: { type: 'string' },   // 이번 달 쓴 데이터·요금제 기본 데이터 (화면 글자 그대로)
    plan_benefits: { type: 'array', items: { type: 'string' } },     // 요금제에 들어 있는 구독 서비스
    device_months_left: { type: 'integer' },                         // 단말 할부 남은 개월 (다 냈으면 0, 모르면 -1)
    selective_discount: { type: 'string', enum: ['applied', 'not_applied', 'unknown'] },
    bundle_discount: { type: 'string', enum: ['applied', 'none', 'unknown'] },
    contract_status: { type: 'string', enum: ['active', 'ended', 'none', 'unknown'] },
    contract_end: { type: 'string' },
    items: {
      type: 'array', items: {
        type: 'object', additionalProperties: false, required: ['role', 'label', 'shown', 'amount', 'image', 'box', 'date'],
        properties: { role: { type: 'string', enum: ROLES }, label: { type: 'string' }, shown: { type: 'string' }, amount: { type: 'integer' }, image: { type: 'integer' }, box: { type: 'array', items: { type: 'integer' } }, date: { type: 'string' } },

};
const VERIFY_SCHEMA = {
  type: 'object', additionalProperties: false, required: ['reads'],
  properties: { reads: { type: 'array', items: { type: 'object', additionalProperties: false, required: ['n', 'text', 'amount'], properties: { n: { type: 'integer' }, text: { type: 'string' }, amount: { type: 'integer' } } } } },
};
const READ_PROMPT = `당신은 한국 사용자의 고정비 화면을 읽는 판독기입니다. 위 이미지는 통신사 앱(가입 정보·요금 조회·청구서), 인터넷·IPTV 가입 정보, 카드 앱 이용내역, 앱스토어·플레이스토어 정기 결제 화면 중 하나입니다. 여러 장이면 한 화면을 나눠 찍은 것일 수 있습니다(겹치는 줄은 한 번만 적으세요).

규칙:

2. 금액마다 shown에는 화면 글자 그대로(예: "월 69,000원"), amount에는 그 숫자만 정수로(예: 69000) 적으세요. 할인·차감도 amount는 양수로 적고 role로 구분하세요. "무료"는 amount 0.
3. box는 그 금액 글자를 감싸는 사각형의 픽셀 좌표 [왼쪽, 위, 오른쪽, 아래]입니다(받은 이미지 크기 기준). image는 몇 번째 이미지인지(1부터).
4. 글자가 흐리거나 잘려서 한 자리라도 확실하지 않은 금액은 items에 넣지 말고 notes에 적으세요. 확실하지 않으면 빼는 것이 틀리는 것보다 낫습니다.
5. role: 요금제 월정액 plan_fee, 부가서비스 addon, 할인 discount, 청구·예상 합계 bill_total, 단말 할부금 device_installment, 인터넷 요금 internet_fee, TV 요금 tv_fee.
6. 카드 이용내역이면 보이는 결제 줄을 빠짐없이 넣으세요. 정기결제(구독)로 보이는 줄은 subscription, 나머지는 row, 화면에 이용금액 합계가 있으면 statement_total. label에는 가맹점 이름을 화면 그대로, date에는 결제일을 넣으세요.
7. selective_discount(선택약정 할인)·bundle_discount(결합 할인)·contract_status(약정 상태)는 화면에 쓰인 대로만 정하고, 안 보이면 unknown. contract_end는 약정 끝나는 날(YYYY-MM-DD), 모르면 빈칸.
8. 날짜는 YYYY-MM-DD로, 연도가 안 보이면 MM-DD로 적으세요.
9. 휴대폰 화면이면 data_used에 이번 달 쓴 데이터를 화면 글자 그대로(예: "12.3GB"), data_quota에 요금제 기본 데이터를 화면 글자 그대로(예: "무제한", "15GB") 적으세요. 안 보이면 빈칸.
10. plan_benefits에는 요금제에 들어 있어 따로 돈을 내지 않는 구독 서비스 이름만 넣으세요(예: ["유튜브 프리미엄"]). 할인 쿠폰·부가서비스는 넣지 마세요. 안 보이면 빈 배열.
11. device_months_left는 단말(휴대폰 기계) 할부가 남은 개월 수입니다. "완납"이거나 할부가 없다고 쓰여 있으면 0, 화면에 안 보이면 -1.`;
const VERIFY_PROMPT = `위 조각들은 휴대폰 화면의 일부를 잘라 크게 키운 것입니다. 조각마다 가운데에 보이는 금액(원)을 글자 그대로 text에 옮기고, 숫자만 정수로 amount에 적으세요(예: "월 69,000원" → 69000, "40만 원" → 400000).
금액이 잘렸거나 흐려서 한 자리라도 확실하지 않으면 amount 0, text 빈칸으로 두세요. 조각끼리 비교하거나 추측하지 마세요. n은 조각 번호입니다.`;

// 화면 글자에서 금액 숫자 뽑기 (코드 검산용). 조금이라도 애매하면 null → '확인됨'이 되지 않고 사람에게 묻는다
// "월 69,000원"·"40만 원"·"4만5천원"·"1만2,500원"·"5천원"·"₩13,500"·"무료"는 읽고, 금액이 둘 이상이거나 쉼표 자리가 틀리면 null
function moneyOf(text) {
  const t = String(text == null ? '' : text).replace(/\s*(만|천|원)\s*/g, '$1').replace(/₩\s*/g, '₩').trim();
  if (!t) return null;
  if (/무료/.test(t) && !/\d/.test(t)) return 0;
  const ok = n => /^(\d{1,3}(,\d{3})+|\d+)$/.test(n);   // 쉼표가 세 자리마다 있거나 아예 없는 숫자만
  const exprs = t.match(/\d[\d,.]*만(?:\d천)?(?:[\d,]+)?원?|\d[\d,]*천원?|\d[\d,]*원|₩[\d,]+/g) || [];
  if (exprs.length > 1) return null;                    // 금액이 둘 이상이면 어느 것인지 모른다
  if (exprs.length === 1) {
    const e = exprs[0];
    let m = e.match(/^(\d+(?:\.\d+)?)만(?:(\d)천)?([\d,]+)?원?$/);
    if (m) return m[3] && !ok(m[3]) ? null : Math.round(Number(m[1]) * 10000) + (m[2] ? Number(m[2]) * 1000 : 0) + (m[3] ? Number(m[3].replace(/,/g, '')) : 0);
    m = e.match(/^(\d+)천원?$/);
    if (m) return Number(m[1]) * 1000;
    const n = e.replace(/^₩/, '').replace(/원$/, '');
    return ok(n) ? Number(n.replace(/,/g, '')) : null;
  }
  const nums = t.match(/\d[\d,]*/g) || [];
  return nums.length === 1 && ok(nums[0]) ? Number(nums[0].replace(/,/g, '')) : null;
}

// ── 사진 준비: 긴 스크롤 캡처는 겹치게 나누고, 모델이 줄이지 않는 크기(긴 변 2576·4784칸 이하)로 맞춘다
function loadImg(src) { return new Promise((res, rej) => { const im = new Image(); im.onload = () => res(im); im.onerror = () => rej(new Error('사진을 열 수 없어요')); im.src = src; }); }
function fileUrl(f) { return new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = () => rej(new Error('사진을 읽을 수 없어요')); r.readAsDataURL(f); }); }
async function prepare(srcs) {
  const out = [];
  for (const src of srcs) {
    const im = await loadImg(src);
    const w = im.naturalWidth, h = im.naturalHeight, tiles = [];
    if (h / w > 2.35) {
      const th = Math.round(w * 2.1), stepY = Math.round(th * 0.9);
      for (let y = 0; y < h; y += stepY) { const y1 = Math.min(h, y + th); tiles.push([Math.max(0, y1 - th), y1]); if (y1 >= h) break; }
    } else tiles.push([0, h]);
    for (const [y0, y1] of tiles) {
      const th = y1 - y0;
      let sc = Math.min(1, 2576 / Math.max(w, th));
      while (Math.ceil(w * sc / 28) * Math.ceil(th * sc / 28) > 4700) sc *= 0.97;
      const cv = document.createElement('canvas'); cv.width = Math.round(w * sc); cv.height = Math.round(th * sc);
      const g = cv.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, cv.width, cv.height);
      g.imageSmoothingQuality = 'high'; g.drawImage(im, 0, y0, w, th, 0, 0, cv.width, cv.height);
      out.push({ dataUrl: cv.toDataURL('image/jpeg', 0.92), w: cv.width, h: cv.height, canvas: cv });
    }
  }
  if (out.length > 10) throw new Error('한 번에 너무 많아요. 나눠서 올려 주세요');
  return out;
}

// 근거 조각: 금액 위치를 넉넉히 잘라 키운다 (2단계 읽기와 화면 표시에 같이 쓴다)
function cropEvidence(img, box) {
  if (!img || !Array.isArray(box) || box.length !== 4) return null;
  let [x0, y0, x1, y1] = box.map(Number);
  if (![x0, y0, x1, y1].every(Number.isFinite)) return null;
  if (x1 < x0) [x0, x1] = [x1, x0];
  if (y1 < y0) [y0, y1] = [y1, y0];
  const bh = Math.max(14, y1 - y0);
  x0 = Math.max(0, x0 - Math.max(24, bh * 1.2)); x1 = Math.min(img.w, x1 + Math.max(24, bh * 1.2));
  y0 = Math.max(0, y0 - Math.max(12, bh * 0.7)); y1 = Math.min(img.h, y1 + Math.max(12, bh * 0.7));
  const w = x1 - x0, h = y1 - y0;
  if (w < 10 || h < 10) return null;
  const sc = Math.min(3, Math.max(1, 120 / h));
  const cv = document.createElement('canvas'); cv.width = Math.round(w * sc); cv.height = Math.round(h * sc);
  const g = cv.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, cv.width, cv.height);
  g.imageSmoothingQuality = 'high'; g.drawImage(img.canvas, x0, y0, w, h, 0, 0, cv.width, cv.height);
  return cv.toDataURL('image/jpeg', 0.92);
}

// ── Claude API 부르기 (열쇠는 이 폰 안에서만 쓴다)
// 오류는 쉬운 말(message) + 고치는 법(fix) + 띄울 버튼(kind: retry·key·billing·photo) + 접어 둘 영어 원문(raw)
function aiErr(message, fix, kind, raw) { return Object.assign(new Error(message), { fix, kind, raw: raw || '' }); }

  }

  if (r.status === 0) throw NO_NET(raw);
