    if (r.status === 401) throw aiErr('AI 열쇠가 맞지 않아요', '설정에서 열쇠를 다시 붙여 넣어 주세요', 'key', raw);
    if (r.status === 403) throw aiErr('이 열쇠로는 AI를 쓸 수 없어요', '콘솔에서 새 열쇠를 만들어 넣어 주세요', 'key', raw);
    if (/credit balance|billing|purchase credits/i.test(em)) throw aiErr('AI 사용 잔액이 없어요', '콘솔의 결제(Billing)에서 충전한 뒤 다시 해 주세요', 'billing', raw);
    if (r.status === 413 || /too large|exceeds|too many/i.test(em)) throw aiErr('사진이 너무 크거나 많아요', '사진 수를 줄여 다시 올려 주세요', 'photo', raw);
    if (r.status === 429) throw aiErr('잠깐 사이 요청이 많았어요', '1분쯤 뒤에 다시 눌러 주세요', 'retry', raw);
    if (r.status >= 500) throw aiErr('AI 서버가 바빠요', '잠시 뒤 다시 눌러 주세요', 'retry', raw);
    throw aiErr('AI가 요청을 처리하지 못했어요', '다시 눌러 보고, 계속 안 되면 다른 사진으로 해 보세요', 'retry', raw);
  }
  if (j.stop_reason === 'refusal') throw aiErr('AI가 이 사진은 읽지 않았어요', '요금·이용내역 화면만 찍어 올려 주세요', 'photo', 'stop_reason: refusal');
  if (j.stop_reason === 'max_tokens') throw aiErr('한 번에 읽을 내용이 너무 많아요', '화면을 나눠 찍어 올려 주세요', 'photo', 'stop_reason: max_tokens');

}
const textOf = j => { const b = (j.content || []).find(x => x.type === 'text'); return b ? b.text : ''; };
function parseJson(t) {

  throw aiErr('AI 답을 읽지 못했어요', '다시 눌러 주세요', 'retry', String(t).slice(0, 300));
}

// ── 읽기 전체 흐름
async function runRead() {
  if (!CAP || CAP.busy) return;
  CAP.busy = true; CAP.cancelled = false; CAP.error = '';
  showReading('화면을 읽고 있어요', CAP.sample ? '예시 판독 · AI 없이 보여 드려요' : '1 / 2단계 · 보통 20~40초');
  try {
    let r1, items;
    if (CAP.sample) {
      await new Promise(r => setTimeout(r, 1300));
      r1 = JSON.parse(JSON.stringify(SAMPLES[CAP.sample]));
      items = r1.items.map(normItem);
      items.forEach(it => { it.crop = cropEvidence(CAP.images[it.image - 1], it.box); });
      updateReading('금액을 한 번 더 확인하고 있어요', '2 / 2단계 · 잘라서 크게 다시 읽는 중');
      await new Promise(r => setTimeout(r, 1100));
      items.forEach(it => { it.read2 = it.amount; it.read2text = it.shown; });
    } else {
      const key = aiKey();
      const content = [];
      CAP.images.forEach((im, i) => { content.push({ type: 'text', text: `이미지 ${i + 1}:` }); content.push({ type: 'image', source: { type: 'base64', media_type: 'image/jpeg', data: im.dataUrl.split(',')[1] } }); });
      content.push({ type: 'text', text: READ_PROMPT });
      const j1 = await claudeCall({ model: AI_MODEL, max_tokens: 16000, output_config: { effort: 'high', format: { type: 'json_schema', schema: READ_SCHEMA } }, messages: [{ role: 'user', content }] }, key);
      if (CAP.cancelled) return;
      r1 = parseJson(textOf(j1));
      items = (r1.items || []).map(normItem).filter(it => it.image >= 1 && it.image <= CAP.images.length);
      items.forEach(it => { it.crop = cropEvidence(CAP.images[it.image - 1], it.box); });
      const money = items.filter(it => it.amount > 0 && it.crop);
      if (money.length) {
        updateReading('금액을 한 번 더 확인하고 있어요', '2 / 2단계 · 잘라서 크게 다시 읽는 중');
        const c2 = [];
        money.forEach((it, k) => { c2.push({ type: 'text', text: `조각 ${k + 1}:` }); c2.push({ type: 'image', source: { type: 'base64', media_type: 'image/jpeg', data: it.crop.split(',')[1] } }); });
        c2.push({ type: 'text', text: VERIFY_PROMPT });
        const j2 = await claudeCall({ model: AI_MODEL, max_tokens: 8000, output_config: { effort: 'medium', format: { type: 'json_schema', schema: VERIFY_SCHEMA } }, messages: [{ role: 'user', content: c2 }] }, key);
        if (CAP.cancelled) return;
        const r2 = parseJson(textOf(j2));
        money.forEach((it, k) => { const v = (r2.reads || []).find(x => x.n === k + 1); it.read2 = v ? v.amount : null; it.read2text = v ? v.text : ''; });
      }
    }
    CAP.result = finish(r1, items);
  } catch (e) {
    CAP.error = { message: e.message || '읽지 못했어요', fix: e.fix || '', kind: e.kind || 'retry', raw: e.raw || '' };
  } finally {
    CAP.busy = false; hideReading();
    if (!CAP.cancelled) render();
  }
}
function normItem(x) {
  return { role: ROLES.includes(x.role) ? x.role : 'other', label: String(x.label || '').trim(), shown: String(x.shown || '').trim(), amount: Math.max(0, Math.round(Number(x.amount) || 0)), image: Math.round(Number(x.image) || 1), box: x.box, date: String(x.date || '') };
}
// 검산: (1) 1단계 숫자 = 화면 글자 그대로의 숫자, (2) 1단계 = 2단계(잘라서 다시 읽기). 둘 다 맞아야 '확인됨'
function finish(r1, items) {
  for (const it of items) {
    const fromText = moneyOf(it.shown);
    it.textOk = fromText === it.amount;
    it.verified = it.amount === 0 ? it.textOk : (it.textOk && it.read2 === it.amount);
    it.confirmed = false;
  }
  const checks = [];
  const sum = rs => items.filter(it => rs.includes(it.role)).reduce((a, it) => a + it.amount, 0);
  const tot = items.find(it => it.role === 'statement_total');
  if (tot) {
    const rows = sum(['subscription', 'row']);
    checks.push(rows === tot.amount ? { ok: true, t: `결제 줄을 모두 더한 값(${won(rows)}원)이 화면 합계와 같아요` } : { ok: false, t: `결제 줄 합(${won(rows)}원)이 화면 합계(${won(tot.amount)}원)와 달라요 · 화면에 안 보인 줄이 있을 수 있어요` });
  }
  const bill = items.find(it => it.role === 'bill_total');
  if (bill) {
    const parts = sum(['plan_fee', 'addon', 'device_installment', 'internet_fee', 'tv_fee']) - sum(['discount']);
    if (parts === bill.amount) checks.push({ ok: true, t: `요금 항목을 더한 값(${won(parts)}원)이 화면 합계와 같아요` });
  }
  return { kind: r1.kind, provider: r1.provider || '', plan: r1.plan_name || '', sel: r1.selective_discount, bundle: r1.bundle_discount, contract: r1.contract_status, contractEnd: /^\d{4}-\d{2}-\d{2}$/.test(r1.contract_end || '') ? r1.contract_end : '', notes: r1.notes || '', items, checks, sample: !!CAP.sample,
    dataUsed: gbOf(r1.data_used), dataQuota: String(r1.data_quota || ''), benefits: (r1.plan_benefits || []).map(x => String(x).trim()).filter(Boolean).slice(0, 5),

}

// ── 읽는 중 화면
let readTimer = null;
function showReading(t, s) {
  hideReading();
  const el = document.createElement('div'); el.className = 'reading'; el.id = 'reading';
  el.innerHTML = `<img src="${IMG.read}" alt=""><b><span id="rt">${t}</span><span class="dots"></span></b><div class="muted" id="rs" style="margin-top:6px">${s}</div><div class="muted num" id="rsec" style="margin-top:4px"></div><div class="gap"></div><button class="btn g sm" data-act="stopRead">그만두기</button>`;
  document.body.appendChild(el);
  const t0 = Date.now();
  readTimer = setInterval(() => { const e = $('#rsec'); if (e) e.textContent = Math.round((Date.now() - t0) / 1000) + '초'; }, 1000);
}

ACT.capApply = () => {
  const R = CAP.result, ok = it => it.verified || it.confirmed, snap = snapshot();
  const pick = role => R.items.find(it => it.role === role && it.amount > 0 && ok(it));
  const plan = pick('plan_fee'), net = pick('internet_fee'), tv = pick('tv_fee');
  const addons = R.items.filter(it => it.role === 'addon' && it.amount > 0 && ok(it)).map(it => ({ name: it.label || '부가서비스', fee: it.amount }));
  const src = R.sample ? '예시 캡처' : '캡처(두 번 확인)';
  let n = 0;
  if (plan || R.kind === 'phone') {
    const P = S.phone && S.phone.has ? S.phone : { has: true, addons: [] };
    S.phone = { ...P, has: true, fee: plan ? plan.amount : P.fee || 0, plan: R.plan || P.plan || '', addons: addons.length || plan ? addons : (P.addons || []),
      sel: R.sel === 'applied' ? 'applied' : R.sel === 'not_applied' ? 'none' : (P.sel || 'unknown'),
      contract: R.contract !== 'unknown' ? R.contract : (P.contract || 'unknown'), contractEnd: !net && R.contractEnd ? R.contractEnd : (P.contractEnd || ''),
      // 선택약정 칸이 보이면 이통3사(알뜰폰엔 없음), 아니면 회사 이름으로
      carrier: R.sel !== 'unknown' ? '이통3사' : /알뜰|모바일|헬로|세븐|프리티|이야기|아이즈|티플러스/.test(R.provider) ? '알뜰폰' : /SK|KT|LG|유플러스/.test(R.provider) ? '이통3사' : (P.carrier || '모름'),
      carrierName: /SK/.test(R.provider) ? 'SKT' : /KT/.test(R.provider) ? 'KT' : /LG|유플러스/.test(R.provider) ? 'LG U+' : (P.carrierName || carrier().name || ''),
      bundle: R.bundle === 'applied' ? 'yes' : R.bundle === 'none' ? 'no' : (P.bundle || ''),
      dataUse: R.dataUsed != null ? R.dataUsed : P.dataUse, dataTier: R.dataUsed != null ? tierOf(R.dataUsed) : P.dataTier,
      benefits: R.benefits.length ? R.benefits : (P.benefits || []),
      deviceLeft: R.deviceLeft >= 0 ? R.deviceLeft : P.deviceLeft,
      deviceEnd: R.deviceLeft > 0 ? ymd(new Date(today().getFullYear(), today().getMonth() + R.deviceLeft, 1)) : R.deviceLeft === 0 ? '' : (P.deviceEnd || ''),   // 할부가 끝나는 달(그달 1일)
      est: false, src };
    n++;
  }
  if (net || tv) {
    const N = S.net && S.net.has ? S.net : { has: true };
    S.net = { ...N, has: true, fee: net ? net.amount : N.fee || 0, tv: !!tv || !!N.tv, tvFee: tv ? tv.amount : N.tvFee || 0, contractEnd: R.contractEnd || N.contractEnd || '', carrier: R.kind === 'internet' && R.provider ? R.provider : N.carrier, speed: (R.kind === 'internet' && speedOf(R.plan)) || N.speed || '', est: false, src };
    n++;
  }
  const chosen = $$('.capchk').filter(c => c.checked).map(c => R.items[Number(c.dataset.i)]).filter(ok);
  for (const it of chosen) {
    const c = findCatalogByName(it.label);
    const day = Number((it.date.match(/(\d{1,2})$/) || [])[1]) || 0;
    const cur = (S.subs || []).find(x => (c && x.id === c.id) || x.name === it.label);
    if (cur) { cur.fee = it.amount; if (day) cur.day = day; }
    else S.subs.push({ id: c ? c.id : 'x' + Date.now() + Math.random().toString(36).slice(2, 6), name: c ? c.name : it.label, fee: it.amount, day, status: 'keep' });
    n++;
  }
  if (!n) { toast('넣을 금액이 없었어요'); return; }
  S.demo = false; S.onboarded = true; save();   // 공유로 받은 캡처로 처음 시작해도 바로 홈으로
  CAP = null;
  go('#home');
  showUndo(`확인된 금액만 넣었어요 (${n}곳)`, snap);
};

async function drawShare() {
  const W = 1080, H = 1920, cv = document.createElement('canvas');
  cv.width = W; cv.height = H;
  const g = cv.getContext('2d');
  const fb = getComputedStyle(document.documentElement).getPropertyValue('--f-body').trim() || 'sans-serif';
  const F = (w, s) => `${w} ${s}px ${fb}`;   // 굵기 500·600·700만
  await Promise.all([500, 600, 700].map(w => document.fonts.load(F(w, 40), '고정비서 영수증 0123456789원').catch(() => null)));   // 글꼴이 다 온 뒤에 그린다
  g.fillStyle = '#F3F4F8'; g.fillRect(0, 0, W, H);
  // 아래 큰 숫자: 아낀 돈이 있으면 아낀 돈, 없으면 찾아낸 새는 돈, 둘 다 없으면 이번 달 고정비
  const L = findLeaks(S), leak = leakSum(L), saved = savedSum(S);
  let label, big, color, sub = '';
  if (saved) { label = '매달 아낀 돈'; big = `월 ${won(saved)}원`; color = '#0B7A5C'; if (leak) sub = `아직 새는 돈 월 ${won(leak)}원`; }
  else if (leak) { label = '찾아낸 새는 돈'; big = `월 ${won(leak)}원`; color = '#E8590C'; }
  else { label = '이번 달 고정비'; big = SHARE.hide ? '•••••원' : won(totalFee(S)) + '원'; color = '#191F28'; }
  // 영수증 종이 (테두리·그림자 없이)
  const subs = S.subs || [];
  const rows = [['휴대폰', S.phone && S.phone.has ? 1 : 0, phoneFee(S)], ['인터넷', S.net && S.net.has ? 1 : 0, netFee(S)], ['TV', S.net && S.net.has && S.net.tv ? 1 : 0, tvFee(S)], ['구독', subs.length, subsFee(S)]];
  const x0 = 150, x1 = W - 150, y0 = 520, rowH = 116;
  const nameLines = SHARE.names && subs.length ? Math.ceil(subs.length / 3) : 0;
  const y1 = y0 + 190 + rowH * rows.length + nameLines * 52 + 70 + 330 + (sub ? 56 : 0);
  g.fillStyle = '#fff';
  g.beginPath(); g.moveTo(x0 + 30, y0); g.lineTo(x1 - 30, y0); g.quadraticCurveTo(x1, y0, x1, y0 + 30); g.lineTo(x1, y1);
  for (let x = x1; x > x0; x -= 40) { g.lineTo(x - 20, y1 + 22); g.lineTo(x - 40, y1); }   // 아래 톱니
  g.lineTo(x0, y0 + 30); g.quadraticCurveTo(x0, y0, x0 + 30, y0); g.closePath(); g.fill();
  // 캐릭터
  const m = await new Promise(r => { const im = new Image(); im.onload = () => r(im); im.onerror = () => r(null); im.src = IMG.main; });
  if (m) { const mw = 330, mh = mw * m.height / m.width; g.drawImage(m, W / 2 - mw / 2, y0 - mh + 120, mw, mh); }
  g.fillStyle = '#191F28'; g.textAlign = 'center';
  g.font = F(700, 64); g.fillText(`${today().getMonth() + 1}월 고정비 영수증`, W / 2, y0 + 140);
  g.textAlign = 'left';
  let y = y0 + 240;
  rows.forEach(([t, n, fee]) => {
    g.fillStyle = '#4E5968'; g.font = F(600, 42); g.fillText(t, x0 + 70, y);
    g.textAlign = 'right';
    if (n) { g.fillStyle = '#191F28'; g.font = F(700, SHARE.hide ? 42 : 44); g.fillText(SHARE.hide ? n + '건' : won(fee) + '원', x1 - 70, y); }
    else { g.fillStyle = '#5F6B78'; g.font = F(600, 42); g.fillText('없음', x1 - 70, y); }
    g.textAlign = 'left';
    y += rowH;
  });
  if (nameLines) {
    g.fillStyle = '#4E5968'; g.font = F(500, 32);
    for (let i = 0; i < subs.length; i += 3) { g.fillText(subs.slice(i, i + 3).map(s => s.name).join(' · '), x0 + 70, y - 30); y += 52; }
  }
  g.setLineDash([12, 12]); g.strokeStyle = '#D1D6DB'; g.lineWidth = 3; g.beginPath(); g.moveTo(x0 + 50, y); g.lineTo(x1 - 50, y); g.stroke(); g.setLineDash([]);
  g.textAlign = 'center'; g.fillStyle = '#4E5968'; g.font = F(600, 38); g.fillText(label, W / 2, y + 80);
  g.fillStyle = color; g.font = F(700, 104); g.fillText(big, W / 2, y + 200);
  if (sub) { y += 56; g.fillStyle = '#4E5968'; g.font = F(600, 34); g.fillText(sub, W / 2, y + 200); }
  const tag = '구독 성향: ' + subsType(S);
  g.font = F(700, 38); const tw = g.measureText(tag).width + 70;
  g.fillStyle = '#E8F7F1'; roundRect(g, W / 2 - tw / 2, y + 240, tw, 76, 38); g.fill();
  g.fillStyle = '#0B7A5C'; g.fillText(tag, W / 2, y + 292);
  g.fillStyle = '#191F28'; g.font = F(700, 46); g.fillText('#고정비서', W / 2, H - 150);
  g.fillStyle = '#4E5968'; g.font = F(500, 30); g.fillText('통신·인터넷·TV·구독, 알아서 챙기는 비서', W / 2, H - 95);
  return cv.toDataURL('image/png');
}
// ── 진단서 한 장: 지금 고정비 · 줄일 수 있는 돈 · 할 일 3가지 · 주의할 점 · 다음 점검일. 화면과 그림(가족에게 보내기)이 같은 내용 ──
function reportData(s) {
  const p = planOf(s), N = s.net || {};
  const rows = [['휴대폰', phoneFee(s)], [N.tv ? '인터넷·TV' : '인터넷', netFee(s) + tvFee(s)], ['구독 ' + (s.subs || []).length + '개', subsFee(s)]].filter(r => r[1] > 0);
  const top = p.steps.filter(x => x.when !== 'ask').slice(0, 3);
  const warns = [...new Set(top.flatMap(x => x.warns))].slice(0, 3);   // 할 일 3가지에 딸린 주의할 점만
  return { who: s.nick ? s.nick + '님' : '나의', date: md(ymd(today())), total: totalFee(s), rows, sure: p.sure, more: p.more, top, warns, next: p.next };
}
let REPORT = { url: '' };
SCREENS['#report'] = () => {
  const r = reportData(S);
  return `<div class="screen no-tab">${hdr('고정비 진단서')}
  <div class="card report">
    <div class="rp-h"><b>${esc(r.who)} 고정비 진단서</b><span>${r.date} 기준</span></div>
    <div class="rp-k">이번 달 고정비</div><div class="rp-big num">${won(r.total)}원</div>
    ${r.rows.map(([t, v]) => `<div class="kv"><span class="k">${esc(t)}</span><span class="v num">${won(v)}원</span></div>`).join('')}
    <div class="rp-k">줄일 수 있는 돈</div>
    <div class="rp-save num">${r.sure ? `매달 ${won(r.sure)}원 · 1년 ${won(r.sure * 12)}원` : '확실히 새는 곳은 아직 없어요'}</div>${r.more ? `<div class="note">확인하면 최대 ${won(r.more)}원 더</div>` : ''}
    ${r.top.length ? `<div class="rp-k">할 일 ${r.top.length}가지</div><ol class="rp-steps">${r.top.map(x => `<li><b>${esc(x.title)}</b><span>${x.amount ? '월 ' + won(x.amount) + '원' : '아끼는 돈은 통화해 봐야 알아요'}${x.date ? ' · ' + md(x.date) + '부터' : ''}</span></li>`).join('')}</ol>` : ''}
    ${r.warns.length ? `<div class="rp-k">주의할 점</div><ul class="rp-warns">${r.warns.map(w => `<li>${esc(w)}</li>`).join('')}</ul>` : ''}
    <div class="rp-next">${ico('calendar')}<span>다음 점검 <b>${md(r.next.date)}</b> · ${esc(r.next.why)}</span></div>
  </div>
  <button class="btn p" style="margin-top:12px" data-act="reportSend">${ico('share')}가족에게 보내기</button><button class="link" data-act="reportSave">사진으로 저장</button>
  <div class="note center" style="margin-top:10px">카톡으로 보내면 가족이 같이 챙겨 줄 수 있어요 · 가격은 ${md(PRICES.asof)} 공식 요금 기준</div>
</div>`;
};
AFTER['#report'] = () => { REPORT.url = ''; drawReport().then(u => { REPORT.url = u; }); };   // 누르자마자 보낼 수 있게 미리 그려 둔다
const reportUrl = () => (REPORT.url ? Promise.resolve(REPORT.url) : drawReport());
ACT.reportSend = () => reportUrl().then(u => shareImage(u, 'gojeongbiseo-report.png', '고정비 진단서'));
ACT.reportSave = () => reportUrl().then(u => { const r = saveImage(u, 'gojeongbiseo-report.png'); toast(r === 'saved' ? '사진첩에 저장했어요' : '저장하지 못했어요. 보내기로 저장해 보세요'); });

async function drawReport() {
  const r = reportData(S), W = 1080, cv = document.createElement('canvas');
  cv.width = W; cv.height = 2600;
  const g = cv.getContext('2d');
  const fb = getComputedStyle(document.documentElement).getPropertyValue('--f-body').trim() || 'sans-serif';
  const F = (w, s) => `${w} ${s}px ${fb}`;
  await Promise.all([500, 600, 700].map(w => document.fonts.load(F(w, 40), '고정비 진단서 0123456789원').catch(() => null)));
  const x0 = 70, x1 = W - 70, pad = 70, inner = x1 - x0 - pad * 2;
  // 낱말 단위로 줄을 나눠 쓴다
  const lines = (t, font, max) => { g.font = font; const out = []; let cur = ''; for (const w of String(t).split(' ')) { const n = cur ? cur + ' ' + w : w; if (g.measureText(n).width > max && cur) { out.push(cur); cur = w; } else cur = n; } return cur ? out.concat(cur) : out; };
  const ops = [];   // 먼저 높이를 재고(종이 크기), 그다음 그린다
  let y = 0;
  const text = (t, font, color, opt = {}) => { const ls = lines(t, font, opt.max || inner); for (const l of ls) { y += opt.lh || 0; ops.push([l, font, color, (opt.x || 0), y, opt.align]); } return ls.length; };
  y = 40; text(`${r.who} 고정비 진단서`, F(700, 58), '#191F28', { lh: 70 });
  y += 58; ops.push([`${r.date} 기준 · 고정비서`, F(500, 32), '#5F6B78', 0, y]);
  y += 100; ops.push(['이번 달 고정비', F(600, 34), '#4E5968', 0, y]);
  y += 100; ops.push([won(r.total) + '원', F(700, 92), '#191F28', 0, y]);
  for (const [t, v] of r.rows) { y += 62; ops.push([t, F(500, 36), '#4E5968', 0, y]); ops.push([won(v) + '원', F(600, 36), '#191F28', inner, y, 'right']); }
  y += 56; ops.push(['line', y]);
  y += 90; ops.push(['줄일 수 있는 돈', F(600, 34), '#4E5968', 0, y]);
  y += 92; ops.push([r.sure ? `매달 ${won(r.sure)}원` : '아직 없어요', F(700, 76), '#0B7A5C', 0, y]);
  if (r.sure) { y += 54; ops.push([`1년이면 ${won(r.sure * 12)}원${r.more ? ` · 확인하면 최대 ${won(r.more)}원 더` : ''}`, F(500, 32), '#4E5968', 0, y]); }
  if (r.top.length) {
    y += 96; ops.push([`할 일 ${r.top.length}가지`, F(600, 34), '#4E5968', 0, y]);
    r.top.forEach((x, i) => {
      y += 34; ops.push(['dot', i + 1, y + 48]);   // 번호 동그라미는 첫 줄 글자 높이에 맞춘다
      text(x.title, F(700, 40), '#191F28', { x: 76, max: inner - 76, lh: 48 });
      y += 44; ops.push([`${x.amount ? '월 ' + won(x.amount) + '원' : '아끼는 돈은 통화해 봐야 알아요'}${x.date ? ' · ' + md(x.date) + '부터' : ''}`, F(600, 32), '#0B7A5C', 76, y]);
    });
  }
  if (r.warns.length) {
    y += 96; ops.push(['주의할 점', F(600, 34), '#4E5968', 0, y]);
    for (const w of r.warns) { y += 10; text('! ' + w, F(500, 32), '#C2410C', { lh: 46 }); }
  }
  y += 90; ops.push([`다음 점검 ${md(r.next.date)} · ${r.next.why}`, F(600, 34), '#191F28', 0, y]);
  const y1 = y + 80, H = y1 + 230;
  // 그리기
  cv.height = H;
  g.fillStyle = '#F3F4F8'; g.fillRect(0, 0, W, H);
  g.fillStyle = '#fff'; roundRect(g, x0, 60, x1 - x0, y1, 44); g.fill();
  for (const op of ops) {
    if (op[0] === 'line') { g.strokeStyle = '#E5E8EB'; g.lineWidth = 3; g.beginPath(); g.moveTo(x0 + pad, 60 + op[1]); g.lineTo(x1 - pad, 60 + op[1]); g.stroke(); continue; }
    if (op[0] === 'dot') { g.fillStyle = '#E8F7F1'; g.beginPath(); g.arc(x0 + pad + 26, 60 + op[2] - 14, 26, 0, Math.PI * 2); g.fill(); g.fillStyle = '#0B7A5C'; g.font = F(700, 30); g.textAlign = 'center'; g.fillText(String(op[1]), x0 + pad + 26, 60 + op[2] - 3); g.textAlign = 'left'; continue; }
    const [t, font, color, dx, yy, align] = op;
    g.font = font; g.fillStyle = color; g.textAlign = align || 'left';
    g.fillText(t, x0 + pad + dx, 60 + yy);
  }
  g.textAlign = 'center'; g.fillStyle = '#191F28'; g.font = F(700, 44); g.fillText('#고정비서', W / 2, H - 110);
  g.fillStyle = '#4E5968'; g.font = F(500, 28); g.fillText(`가격은 ${md(PRICES.asof)} 공식 요금 기준 · 전화 영업 없음`, W / 2, H - 62);
  return cv.toDataURL('image/png');
}
function roundRect(g, x, y, w, h, r) { g.beginPath(); g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r); g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath(); }

/* 고정비서 — 시작 */
if (Android && Android.ready) Android.ready(BUILD);
render();
try { if (Android && Android.booted) Android.booted(BUILD_NO); } catch (e) { }   // 화면을 끝까지 그렸다는 신호(자동 업데이트: 받은 판이 고장 나면 앱에 든 판으로)
webUpdateStart();
setTimeout(flushOutbox, 1500);   // 못 보낸 신청서가 있으면 앱을 열 때 다시 보낸다
</script>
